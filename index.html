            return (2 * da) % max - da;
        };

            const diff = shortAngleDist(start, end);

                if (['headSlide', 'bodyX', 'bodyY'].includes(key)) {

            // Clamp distance to prevent unreachable targets
            const d = Math.min(dist, len1 + len2 - 0.1);

            // c^2 = a^2 + b^2 - 2ab cos(C) => cos(C) = (a^2 + b^2 - c^2) / 2ab
            const cosAlpha = (len1 * len1 + d * d - len2 * len2) / (2 * len1 * d);
            const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha))); // Clamp for safety
            
            // Two possible solutions for the first joint (elbow up/down)
            const theta1_A = baseAngle - alpha;
            const theta1_B = baseAngle + alpha;
            
            // Calculate elbow positions for both solutions

                x: origin.x + Math.cos(theta1_A) * len1,
                y: origin.y + Math.sin(theta1_A) * len1
            };

            const theta2_B = Math.atan2(target.y - elbow_B.y, target.x - elbow_B.x);

            // Determine which solution is closer to the current pose

            const distB = Math.abs(shortAngleDist(currentA1, deg1B)) + Math.abs(shortAngleDist(currentA2, deg2B));

            const shoulderWidth = 40;
            const headRadius = 25;

            const waistAngle = (pose.waist || 0) - 90; 
            const shoulderCenter = calculateEndPoint(hipCenterX, hipCenterY, waistAngle, SEGMENT_LENGTHS.torso);

            const rShoulderBase = calculateEndPoint(shoulderCenter.x, shoulderCenter.y, waistAngle - 90, shoulderWidth); 
            const lShoulderBase = calculateEndPoint(shoulderCenter.x, shoulderCenter.y, waistAngle + 90, shoulderWidth); 
            
            const neckBase = shoulderCenter;
            const headSlide = pose.headSlide || 0;
            const headCenterBase = calculateEndPoint(neckBase.x, neckBase.y, waistAngle, SEGMENT_LENGTHS.neck);
            
            const slideX = Math.cos(toRad(waistAngle + 90)) * headSlide;
            const slideY = Math.sin(toRad(waistAngle + 90)) * headSlide;
            const headCenterX = headCenterBase.x + slideX;
            const headCenterY = headCenterBase.y + slideY;

            let displayTilt = (pose.headTilt || 0) + (pose.waist || 0); 
            if (displayTilt > 180) displayTilt -= 360;

            const tiltHandleDist = headRadius + 15;
            const tiltHandleX = headCenterX + Math.cos(toRad(displayTilt - 90)) * tiltHandleDist;
            const tiltHandleY = headCenterY + Math.sin(toRad(displayTilt - 90)) * tiltHandleDist;

            const lElbowPos = calculateEndPoint(lShoulderBase.x, lShoulderBase.y, pose.lShoulder, SEGMENT_LENGTHS.upperArm);
            const lWristPos = calculateEndPoint(lElbowPos.x, lElbowPos.y, pose.lElbow, SEGMENT_LENGTHS.forearm);
            const lHandPos = calculateEndPoint(lWristPos.x, lWristPos.y, pose.lWrist, SEGMENT_LENGTHS.hand);

            const rElbowPos = calculateEndPoint(rShoulderBase.x, rShoulderBase.y, pose.rShoulder, SEGMENT_LENGTHS.upperArm);
            const rWristPos = calculateEndPoint(rElbowPos.x, rElbowPos.y, pose.rElbow, SEGMENT_LENGTHS.forearm);
            const rHandPos = calculateEndPoint(rWristPos.x, rWristPos.y, pose.rWrist, SEGMENT_LENGTHS.hand);

            const lHipPos = { x: hipCenterX + hipWidth, y: hipCenterY };
            const lKneePos = calculateEndPoint(lHipPos.x, lHipPos.y, pose.lHip ?? 90, SEGMENT_LENGTHS.thigh);
            const lAnklePos = calculateEndPoint(lKneePos.x, lKneePos.y, pose.lKnee ?? 90, SEGMENT_LENGTHS.shin);
            const lFootPos = calculateEndPoint(lAnklePos.x, lAnklePos.y, pose.lAnkle ?? 0, SEGMENT_LENGTHS.foot);

            const rHipPos = { x: hipCenterX - hipWidth, y: hipCenterY };
            const rKneePos = calculateEndPoint(rHipPos.x, rHipPos.y, pose.rHip ?? 90, SEGMENT_LENGTHS.thigh);
            const rAnklePos = calculateEndPoint(rKneePos.x, rKneePos.y, pose.rKnee ?? 90, SEGMENT_LENGTHS.shin);
            const rFootPos = calculateEndPoint(rAnklePos.x, rAnklePos.y, pose.rAnkle ?? 180, SEGMENT_LENGTHS.foot);

            return {
                hipCenterX, hipCenterY, shoulderCenter,
                rShoulderBase, lShoulderBase,
                headCenterX, headCenterY, headRadius, displayTilt, neckBase,
                tiltHandleX, tiltHandleY,
                rElbowPos, rWristPos, rHandPos,
                lElbowPos, lWristPos, lHandPos,
                rHipPos, rKneePos, rAnklePos, rFootPos,
                lHipPos, lKneePos, lAnklePos, lFootPos
            };
        };

        // --- Components ---

        const SliderControl = ({ label, value, onChange, min = 0, max = 360, step = 1, snap = 90, unit = "°" }) => {
            const [localVal, setLocalVal] = useState(value);
            useEffect(() => { setLocalVal(Math.round(value)); }, [value]);
            const handleInput = (e) => {
                const v = e.target.value;
                setLocalVal(v);
                const num = parseFloat(v);
                if (!isNaN(num)) onChange(num);
            };
            return (
            <div className="flex flex-col space-y-1 mb-2">
                <div className="flex justify-between items-center text-xs text-cyan-400 font-mono">
                    <span className="font-bold">{label}</span>
                    <div className="flex items-center bg-slate-800/50 rounded border border-slate-700 focus-within:border-cyan-500 focus-within:bg-slate-800 transition-colors">
                        <input type="number" value={localVal} onChange={handleInput} className="w-12 bg-transparent text-right text-cyan-300 focus:text-white focus:outline-none px-1 py-0.5 text-[10px] font-mono" />
                        <span className="text-[10px] text-slate-500 pr-1 select-none">{unit}</span>
                    </div>
                </div>
                <div className="flex items-center space-x-2">
                    <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} className="w-full h-2 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-cyan-500 hover:accent-cyan-400" />
                    {snap !== null && <button onClick={() => onChange(snap === 0 ? 0 : Math.round(value / snap) * snap)} className="p-1 text-[10px] bg-gray-800 text-cyan-500 border border-cyan-900 rounded hover:bg-cyan-900/50 min-w-[30px] flex-shrink-0" title={`Snap to ${snap}${unit}`}>{snap}{unit}</button>}
                </div>
            </div>
            );
        };

        const LimbRenderer = ({ start, end, color, thickness, glow, opacity = 1 }) => (
            <g opacity={opacity}>
                {glow && <line x1={start.x} y1={start.y} x2={end.x} y2={end.y} stroke={color} strokeWidth={thickness + 8} strokeOpacity="0.2" strokeLinecap="round" />}
                <line x1={start.x} y1={start.y} x2={end.x} y2={end.y} stroke={color} strokeWidth={thickness} strokeLinecap="round" />
                <circle cx={end.x} cy={end.y} r={thickness/1.5} fill="#111" stroke={color} strokeWidth="2" />
            </g>
        );

        const DraggableJoint = ({ x, y, isActive, onMouseDown, onTouchStart, isFK = true }) => (
            <g onMouseDown={onMouseDown} onTouchStart={onTouchStart} className="cursor-pointer" style={{ pointerEvents: 'all' }}>
                <circle cx={x} cy={y} r={20} fill="transparent" />
                <circle cx={x} cy={y} r={isActive ? 10 : 6} fill={isActive ? "#ffffff" : "rgba(255,255,255,0.3)"} stroke={isActive ? "#22d3ee" : (isFK ? "white" : "#facc15")} strokeWidth={2} className="transition-all duration-75" />
            </g>
        );

        const DancerFigure = ({ skeleton, opacity = 1 }) => {
            const s = skeleton;
            return (
                <g opacity={opacity}>
                    {/* Floor line */}
                    <line x1="-150" y1="190" x2="150" y2="190" stroke="#334155" strokeWidth="2" strokeDasharray="5,5" opacity="0.5" />
                    
                    <LimbRenderer start={s.rHipPos} end={s.rKneePos} color="#c026d3" thickness={9} glow={true} />
                    <LimbRenderer start={s.rKneePos} end={s.rAnklePos} color="#c026d3" thickness={7} glow={true} />
                    <LimbRenderer start={s.rAnklePos} end={s.rFootPos} color="#e879f9" thickness={5} glow={false} />

                    <LimbRenderer start={s.lHipPos} end={s.lKneePos} color="#0891b2" thickness={9} glow={true} />
                    <LimbRenderer start={s.lKneePos} end={s.lAnklePos} color="#0891b2" thickness={7} glow={true} />
                    <LimbRenderer start={s.lAnklePos} end={s.lFootPos} color="#22d3ee" thickness={5} glow={false} />

                    <path d={`M${s.rHipPos.x} ${s.rHipPos.y} L${s.rShoulderBase.x} ${s.rShoulderBase.y} L${s.lShoulderBase.x} ${s.lShoulderBase.y} L${s.lHipPos.x} ${s.lHipPos.y} Z`} fill="#334155" stroke="#475569" strokeWidth="2" />
                    <line x1={s.rHipPos.x} y1={s.rHipPos.y} x2={s.lHipPos.x} y2={s.lHipPos.y} stroke="#475569" strokeWidth="3" />
                    <line x1={s.shoulderCenter.x} y1={s.shoulderCenter.y} x2={s.headCenterX} y2={s.headCenterY + s.headRadius/2} stroke="#475569" strokeWidth="10" strokeLinecap="round"/>

                    <g transform={`rotate(${s.displayTilt}, ${s.headCenterX}, ${s.headCenterY})`}>
                        <circle cx={s.headCenterX} cy={s.headCenterY} r={s.headRadius} fill="#1e293b" stroke="#94a3b8" strokeWidth="2" />
                        <path d={`M${s.headCenterX-10} ${s.headCenterY-5} L${s.headCenterX-5} ${s.headCenterY-5}`} stroke="#475569" strokeWidth="2"/>
                        <path d={`M${s.headCenterX+5} ${s.headCenterY-5} L${s.headCenterX+10} ${s.headCenterY-5}`} stroke="#475569" strokeWidth="2"/>
                    </g>

                    <LimbRenderer start={s.rShoulderBase} end={s.rElbowPos} color="#d946ef" thickness={8} glow={true} />
                    <LimbRenderer start={s.rElbowPos} end={s.rWristPos} color="#d946ef" thickness={6} glow={true} />
                    <LimbRenderer start={s.rWristPos} end={s.rHandPos} color="#e879f9" thickness={4} glow={false} />

                    <LimbRenderer start={s.lShoulderBase} end={s.lElbowPos} color="#06b6d4" thickness={8} glow={true} />
                    <LimbRenderer start={s.lElbowPos} end={s.lWristPos} color="#06b6d4" thickness={6} glow={true} />
                    <LimbRenderer start={s.lWristPos} end={s.lHandPos} color="#22d3ee" thickness={4} glow={false} />
                </g>
            );
        }

        function TuttingSimulator() {
            // State
            const [pose, setPose] = useState(PRESETS.idle);
            const [timeline, setTimeline] = useState([PRESETS.idle]);
            const [currentFrameIndex, setCurrentFrameIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [bpm, setBpm] = useState(100);
            const [showGrid, setShowGrid] = useState(true);
            const [zoom, setZoom] = useState(1); 
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [selectedPreset, setSelectedPreset] = useState('');
            const [customPresets, setCustomPresets] = useState({}); 
            const [presetName, setPresetName] = useState("");
            const [isDragMode, setIsDragMode] = useState(false);
            const [dragType, setDragType] = useState('FK'); 
            const [activeJoint, setActiveJoint] = useState(null);
            const [formationType, setFormationType] = useState('single');
            const [lang, setLang] = useState('zh-TW');

            const fileInputRef = useRef(null);
            const svgRef = useRef(null);
            const mainGroupRef = useRef(null);
            const lastMousePos = useRef({ x: 0, y: 0 });
            
            const timelineRef = useRef(timeline);
            const frameIndexRef = useRef(currentFrameIndex);
            const requestRef = useRef();
            const startTimeRef = useRef(0);
            
            // Optimized Refs
            const zoomRef = useRef(zoom);
            const activeJointRef = useRef(activeJoint);
            const isDragModeRef = useRef(isDragMode);
            const poseRef = useRef(pose);
            const dragTypeRef = useRef(dragType);

            useEffect(() => { timelineRef.current = timeline; }, [timeline]);
            useEffect(() => { frameIndexRef.current = currentFrameIndex; }, [currentFrameIndex]);
            useEffect(() => { zoomRef.current = zoom; }, [zoom]);
            useEffect(() => { activeJointRef.current = activeJoint; }, [activeJoint]);
            useEffect(() => { isDragModeRef.current = isDragMode; }, [isDragMode]);
            useEffect(() => { poseRef.current = pose; }, [pose]);
            useEffect(() => { dragTypeRef.current = dragType; }, [dragType]);

            const t = (key) => TRANSLATIONS[lang] ? (TRANSLATIONS[lang][key] || key) : key;

            const updatePose = (key, value) => {
                if (!isPlaying) {
                    setPose(prev => ({ ...prev, [key]: value }));
                }
            };

            // --- Interaction ---
            const getSvgPoint = (clientX, clientY) => {
                if (!mainGroupRef.current) return { x: 0, y: 0 };
                const pt = svgRef.current.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const svgP = pt.matrixTransform(mainGroupRef.current.getScreenCTM().inverse());
                return { x: svgP.x, y: svgP.y };
            };

            const handleJointDown = (e, jointName, pivot, type = 'angle', originPos = null) => {
                if (!isDragMode) return;
                e.preventDefault();
                e.stopPropagation();
                setIsPlaying(false);
                setActiveJoint({ name: jointName, pivot, type, origin: originPos });
            };

            const handleSvgMouseDown = (e) => {
                if (!activeJoint) {
                    setIsPanning(true);
                    lastMousePos.current = { x: e.clientX, y: e.clientY };
                }
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const newZoom = Math.min(5, Math.max(0.1, zoom - e.deltaY * 0.001));
                setZoom(newZoom);
            };

            const handleSvgMove = (clientX, clientY) => {
                if (isPanning) {
                    const dx = clientX - lastMousePos.current.x;
                    const dy = clientY - lastMousePos.current.y;
                    setPan(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                    lastMousePos.current = { x: clientX, y: clientY };
                    return;
                }

                const currentActiveJoint = activeJointRef.current;
                const currentIsDragMode = isDragModeRef.current;
                const currentDragType = dragTypeRef.current;
                const currentPose = poseRef.current;

                if (!currentActiveJoint || !currentIsDragMode) return;

                const mousePos = getSvgPoint(clientX, clientY);

                // Remove the 200 offsets because we are now in 0-based local coordinates
                
                if (currentActiveJoint.type === 'headPos') {
                    const waistRad = toRad((currentPose.waist || 0) - 90);
                    const neckBaseX = currentActiveJoint.pivot.x;
                    const neckBaseY = currentActiveJoint.pivot.y;
                    const dx = mousePos.x - neckBaseX;
                    const dy = mousePos.y - neckBaseY;
                    const axisX = Math.cos(waistRad + Math.PI/2);
                    const axisY = Math.sin(waistRad + Math.PI/2);
                    const projection = dx * axisX + dy * axisY;
                    const newVal = Math.max(-50, Math.min(50, projection));
                    updatePose('headSlide', newVal);
                }
                else if (currentActiveJoint.type === 'headTilt') {
                    const dx = mousePos.x - currentActiveJoint.pivot.x;
                    const dy = mousePos.y - currentActiveJoint.pivot.y;
                    let angle = toDeg(Math.atan2(dy, dx));
                    const waistAngle = (currentPose.waist || 0) - 90;
                    let relativeTilt = shortAngleDist(waistAngle, angle);
                    updatePose('headTilt', Math.max(-60, Math.min(60, relativeTilt)));
                }
                else if (currentActiveJoint.type === 'pos') {
                    // Mouse pos is relative to 0,0 center.
                    const dx = mousePos.x;
                    const dy = mousePos.y;
                    updatePose('bodyX', Math.max(-100, Math.min(100, dx)));
                    updatePose('bodyY', Math.max(-100, Math.min(100, dy)));
                }
                else if (currentDragType === 'IK' && currentActiveJoint.type === 'ik') {
                    const { name, origin } = currentActiveJoint;
                    // Two-pass IK for hand tips to ensure arm alignment
                    if (name === 'rWrist' || name === 'lWrist' || name === 'rAnkle' || name === 'lAnkle') {
                        let finalTarget = mousePos;
                        let limbLength1, limbLength2, currentA1, currentA2, propA1, propA2, handLength;
                        
                        if (name === 'rWrist') {
                            limbLength1 = SEGMENT_LENGTHS.upperArm; limbLength2 = SEGMENT_LENGTHS.forearm;
                            currentA1 = currentPose.rShoulder; currentA2 = currentPose.rElbow;
                            propA1 = 'rShoulder'; propA2 = 'rElbow';
                            handLength = SEGMENT_LENGTHS.hand;
                        } else if (name === 'lWrist') {
                            limbLength1 = SEGMENT_LENGTHS.upperArm; limbLength2 = SEGMENT_LENGTHS.forearm;
                            currentA1 = currentPose.lShoulder; currentA2 = currentPose.lElbow;
                            propA1 = 'lShoulder'; propA2 = 'lElbow';
                            handLength = SEGMENT_LENGTHS.hand;
                        } else if (name === 'rAnkle') {
                            limbLength1 = SEGMENT_LENGTHS.thigh; limbLength2 = SEGMENT_LENGTHS.shin;
                            currentA1 = currentPose.rHip ?? 90; currentA2 = currentPose.rKnee ?? 90;
                            propA1 = 'rHip'; propA2 = 'rKnee';
                            handLength = SEGMENT_LENGTHS.foot;
                        } else {
                            limbLength1 = SEGMENT_LENGTHS.thigh; limbLength2 = SEGMENT_LENGTHS.shin;
                            currentA1 = currentPose.lHip ?? 90; currentA2 = currentPose.lKnee ?? 90;
                            propA1 = 'lHip'; propA2 = 'lKnee';
                            handLength = SEGMENT_LENGTHS.foot;
                        }

                        // 1. Solve IK for Mouse Pos (Tentative)
                        const [tA1, tA2] = solveTwoJointIK(mousePos, origin, limbLength1, limbLength2 + handLength, currentA1, currentA2);
                        
                        // 2. Calculate Elbow Pos from Tentative Solution
                        const elbowX = origin.x + Math.cos(toRad(tA1)) * limbLength1;
                        const elbowY = origin.y + Math.sin(toRad(tA1)) * limbLength1;
                        
                        // 3. Calculate angle from Elbow to Mouse
                        const wristAngleRad = Math.atan2(mousePos.y - elbowY, mousePos.x - elbowX);
                        let wristAngleDeg = toDeg(wristAngleRad);
                        if(wristAngleDeg < 0) wristAngleDeg += 360;

                        // 4. Update Wrist Angle
                        if(name === 'rWrist') updatePose('rWrist', wristAngleDeg);
                        else if(name === 'lWrist') updatePose('lWrist', wristAngleDeg);
                        else if(name === 'rAnkle') updatePose('rAnkle', wristAngleDeg);
                        else if(name === 'lAnkle') updatePose('lAnkle', wristAngleDeg);

                        // 5. Calculate Real Target for Wrist Joint
                        const realWristTarget = {
                            x: mousePos.x - Math.cos(wristAngleRad) * handLength,
                            y: mousePos.y - Math.sin(wristAngleRad) * handLength
                        };

                        // 6. Solve IK for Real Target
                        const [fA1, fA2] = solveTwoJointIK(realWristTarget, origin, limbLength1, limbLength2, currentA1, currentA2);
                        updatePose(propA1, fA1);
                        updatePose(propA2, fA2);
                    }
                }
                else {
                    const dx = mousePos.x - currentActiveJoint.pivot.x;
                    const dy = mousePos.y - currentActiveJoint.pivot.y;
                    let angle = toDeg(Math.atan2(dy, dx));
                    if (angle < 0) angle += 360;
                    updatePose(currentActiveJoint.name, angle);
                }
            };

            const handleGlobalMouseUp = () => { 
                setActiveJoint(null); 
                setIsPanning(false);
            };

            useEffect(() => {
                const onMove = (e) => handleSvgMove(e.clientX, e.clientY);
                const onUp = () => handleGlobalMouseUp();
                const onTouchMove = (e) => handleSvgMove(e.touches[0].clientX, e.touches[0].clientY);
                if (activeJoint || isPanning) {
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                    window.addEventListener('touchmove', onTouchMove, { passive: false });
                    window.addEventListener('touchend', onUp);
                }
                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', onUp);
                };
            }, [activeJoint, isPanning]); 

            // --- Animation Loop ---
            const jumpToFrame = (index) => {
                if (isPlaying) setIsPlaying(false);
                setCurrentFrameIndex(index);
                setPose(timeline[index]);
            };

            const handleTimelineScrub = (e) => {
                const index = Number(e.target.value);
                if (isPlaying) setIsPlaying(false);
                setCurrentFrameIndex(index);
                setPose(timeline[index]);
            };

            const addKeyframe = () => {
                const newTimeline = [...timeline, { ...pose }];
                setTimeline(newTimeline);
                setCurrentFrameIndex(newTimeline.length - 1);
            };

            const updateKeyframe = () => {
                const newTimeline = [...timeline];
                newTimeline[currentFrameIndex] = { ...pose };
                setTimeline(newTimeline);
            };

            const deleteKeyframe = () => {
                if (timeline.length <= 1) return;
                const newTimeline = timeline.filter((_, i) => i !== currentFrameIndex);
                setTimeline(newTimeline);
                const newIndex = Math.min(currentFrameIndex, newTimeline.length - 1);
                setCurrentFrameIndex(newIndex);
                setPose(newTimeline[newIndex]);
            };

            const handleAIGenerate = () => {
                setIsPlaying(false);
                const presetKeys = Object.keys(PRESETS);
                const easingKeys = Object.keys(EASING_FUNCTIONS);
                const newLength = 16; 
                const newTimeline = Array(newLength).fill(null).map((_, i) => {
                    const randomKey = presetKeys[Math.floor(Math.random() * presetKeys.length)];
                    const basePose = { ...PRESETS[randomKey] };
                    const randomTilt = Math.floor(Math.random() * 30) - 15;
                    basePose.headTilt = (basePose.headTilt || 0) + randomTilt;
                    const randomEasing = easingKeys[Math.floor(Math.random() * easingKeys.length)];
                    basePose.easing = randomEasing;
                    if (Math.random() > 0.6) basePose.headSlide = Math.floor(Math.random() * 40) - 20; else basePose.headSlide = 0; 
                    if (Math.random() > 0.6) basePose.waist = Math.floor(Math.random() * 40) - 20;
                    if (Math.random() > 0.7) { if (Math.random() > 0.5) basePose.bodyX = Math.floor(Math.random() * 60) - 30; else basePose.bodyY = Math.floor(Math.random() * 40) - 20; } else { basePose.bodyX = 0; basePose.bodyY = 0; }
                    return basePose;
                });
                setTimeline(newTimeline);
                setCurrentFrameIndex(0);
                setPose(newTimeline[0]);
                setTimeout(() => setIsPlaying(true), 500);
            };

            const handleExport = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timeline));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "tutting_dance.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const handleImport = (event) => {
                const fileReader = new FileReader();
                const file = event.target.files[0];
                if(!file) return;
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const importedTimeline = JSON.parse(e.target.result);
                        if (Array.isArray(importedTimeline) && importedTimeline.length > 0) {
                            setIsPlaying(false);
                            setTimeline(importedTimeline);
                            setPose(importedTimeline[0]);
                            setCurrentFrameIndex(0);
                            alert(t('importSuccess'));
                        } else {
                            alert(t('importError'));
                        }
                    } catch (error) { alert(t('importFail')); }
                };
                event.target.value = null; 
            };

            const handleSaveCustomPreset = () => {
                if (!presetName.trim()) { alert(t('nameEmpty')); return; }
                setCustomPresets(prev => ({ ...prev, [presetName]: { ...pose } }));
                setPresetName("");
                alert(t('saveSuccess'));
            };

            const handlePresetChange = (e) => {
                const key = e.target.value;
                setSelectedPreset(key);
                if (isPlaying) return;
                if (PRESETS[key]) setPose(PRESETS[key]);
                else if (customPresets[key]) setPose(customPresets[key]);
            };

            useEffect(() => {
                if (!isPlaying) { if (requestRef.current) cancelAnimationFrame(requestRef.current); return; }
                startTimeRef.current = performance.now();
                const animate = (time) => {
                    const beatDuration = 60000 / bpm;
                    const elapsed = time - startTimeRef.current;
                    let progress = elapsed / beatDuration;
                    if (progress >= 1) {
                        const nextIndex = (frameIndexRef.current + 1) % timelineRef.current.length;
                        setCurrentFrameIndex(nextIndex);
                        frameIndexRef.current = nextIndex;
                        startTimeRef.current = time;
                        progress = 0;
                    }
                    const currentIndex = frameIndexRef.current;
                    const nextIndex = (currentIndex + 1) % timelineRef.current.length;
                    const startPose = timelineRef.current[currentIndex];
                    const endPose = timelineRef.current[nextIndex];
                    const easingName = startPose?.easing || 'Smooth (流暢)';
                    const easeFn = EASING_FUNCTIONS[easingName] || EASING_FUNCTIONS['Smooth (流暢)'];
                    const easedProgress = easeFn(progress);
                    if (startPose && endPose) setPose(interpolatePose(startPose, endPose, easedProgress));
                    requestRef.current = requestAnimationFrame(animate);
                };
                requestRef.current = requestAnimationFrame(animate);
                return () => { if (requestRef.current) cancelAnimationFrame(requestRef.current); };
            }, [isPlaying, bpm]); 

            const handleZoomIn = () => setZoom(z => Math.min(5, z + 0.2));
            const handleZoomOut = () => setZoom(z => Math.max(0.1, z - 0.2));
            const handleResetView = () => {
                setZoom(1);
                setPan({ x: 0, y: 0 });
            };

            // --- Rendering ---
            const skeleton = useMemo(() => calculateSkeleton(pose), [pose]);
            const formationData = FORMATIONS[formationType] || FORMATIONS['single'];
            // Identify Main Dancer from formation
            const mainDancer = formationData.find(d => d.main) || formationData[0];

            return (
                <div className="h-[100dvh] bg-slate-950 text-white font-sans selection:bg-cyan-500/30 flex flex-col md:flex-row overflow-hidden">
                
                {/* --- TOP/LEFT PANEL --- */}
                <div className="w-full md:flex-1 h-[55%] md:h-full flex flex-col relative border-b md:border-b-0 md:border-r border-slate-800 z-10 bg-slate-950 min-w-0">
                    
                    <div className="absolute top-3 left-3 z-10 flex items-start gap-4 pointer-events-none">
                        <div>
                            <h1 className="text-xl md:text-3xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">{t('title')}</h1>
                            <p className="text-[10px] md:text-xs text-slate-500 font-mono mt-0.5">{t('subtitle')}</p>
                        </div>
                    </div>

                    <div className="absolute top-3 right-3 z-10">
                        <div className="flex items-center bg-slate-800/80 backdrop-blur-sm border border-slate-700 rounded-full px-2 py-1 cursor-pointer hover:bg-slate-700 transition-colors">
                            <Globe size={14} className="text-slate-400 mr-1" />
                            <select value={lang} onChange={(e) => setLang(e.target.value)} className="bg-transparent text-[10px] md:text-xs text-slate-300 focus:outline-none cursor-pointer appearance-none pr-2">
                                <option value="zh-TW">繁體中文</option>
                                <option value="en">English</option>
                                <option value="ja">日本語</option>
                                <option value="ko">한국어</option>
                                <option value="es">Español</option>
                                <option value="pt">Português</option>
                                <option value="fr">Français</option>
                                <option value="de">Deutsch</option>
                                <option value="vi">Tiếng Việt</option>
                                <option value="hi">हिन्दी</option>
                                <option value="ru">Русский</option>
                            </select>
                        </div>
                    </div>

                    <div className={`flex-1 w-full flex items-center justify-center overflow-hidden relative p-2 bg-slate-900 ${isPanning ? 'cursor-grabbing' : 'cursor-grab'}`}>
                        {showGrid && (
                            <div className="absolute inset-0 opacity-20 pointer-events-none" 
                                style={{ 
                                    backgroundImage: 'linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px)', 
                                    backgroundSize: '40px 40px',
                                }}>
                            </div>
                        )}

                        <div className="relative h-full w-full flex items-center justify-center" onWheel={handleWheel} onMouseDown={handleSvgMouseDown}>
                            <svg ref={svgRef} className="w-full h-full select-none" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
                                <defs>
                                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                                    <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                                </filter>
                                </defs>

                                {/* Correct Coordinate System:
                                    1. Translate to Screen Center (200, 200) + Pan Offset.
                                    2. Scale (Zoom).
                                    (No negative translate needed because skeleton is 0-based)
                                */}
                                <g ref={mainGroupRef} transform={`translate(${200 + pan.x}, ${200 + pan.y}) scale(${zoom})`}>
                                    
                                    {/* Render Formation Dancers */}
                                    {formationData.map((dancer, idx) => (
                                        <g key={idx} transform={`translate(${dancer.x}, ${dancer.y}) scale(${dancer.scale})`}>
                                            <DancerFigure skeleton={skeleton} opacity={dancer.opacity} />
                                        </g>
                                    ))}

                                    {/* Interactive Handles (Transformed by Main Dancer's Position) */}
                                    {isDragMode && mainDancer && (
                                        <g transform={`translate(${mainDancer.x}, ${mainDancer.y}) scale(${mainDancer.scale})`}>
                                            {/* Body Center */}
                                            <DraggableJoint x={skeleton.hipCenterX} y={skeleton.hipCenterY} isActive={activeJoint?.name === 'bodyX'} onMouseDown={(e) => handleJointDown(e, 'bodyX', null, 'pos')} onTouchStart={(e) => handleJointDown(e, 'bodyX', null, 'pos')} />
                                            <DraggableJoint x={skeleton.headCenterX} y={skeleton.headCenterY} isActive={activeJoint?.type === 'headPos'} onMouseDown={(e) => handleJointDown(e, 'head', skeleton.neckBase, 'headPos')} onTouchStart={(e) => handleJointDown(e, 'head', skeleton.neckBase, 'headPos')} />
                                            <DraggableJoint x={skeleton.tiltHandleX} y={skeleton.tiltHandleY} isActive={activeJoint?.type === 'headTilt'} onMouseDown={(e) => handleJointDown(e, 'headTilt', {x: skeleton.headCenterX, y: skeleton.headCenterY}, 'headTilt')} onTouchStart={(e) => handleJointDown(e, 'headTilt', {x: skeleton.headCenterX, y: skeleton.headCenterY}, 'headTilt')} isFK={false} />

                                            {/* Right Arm */}
                                            <DraggableJoint x={skeleton.rElbowPos.x} y={skeleton.rElbowPos.y} isActive={activeJoint?.name === 'rShoulder'} onMouseDown={(e) => handleJointDown(e, 'rShoulder', skeleton.rShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'rShoulder', skeleton.rShoulderBase)} />
                                            <DraggableJoint x={skeleton.rWristPos.x} y={skeleton.rWristPos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'rWrist' : 'rElbow')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'rWrist' : 'rElbow', dragType === 'IK' ? skeleton.rShoulderBase : skeleton.rElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rShoulderBase)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'rWrist' : 'rElbow', dragType === 'IK' ? skeleton.rShoulderBase : skeleton.rElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rShoulderBase)} isFK={dragType === 'FK'} />
                                            {dragType === 'FK' && <DraggableJoint x={skeleton.rHandPos.x} y={skeleton.rHandPos.y} isActive={activeJoint?.name === 'rWrist'} onMouseDown={(e) => handleJointDown(e, 'rWrist', skeleton.rWristPos)} onTouchStart={(e) => handleJointDown(e, 'rWrist', skeleton.rWristPos)} />}
                                            {dragType === 'IK' && <DraggableJoint x={skeleton.rHandPos.x} y={skeleton.rHandPos.y} isActive={activeJoint?.name === 'rWrist'} onMouseDown={(e) => handleJointDown(e, 'rWrist', skeleton.rShoulderBase, 'ik', skeleton.rShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'rWrist', skeleton.rShoulderBase, 'ik', skeleton.rShoulderBase)} isFK={false} />}

                                            {/* Left Arm */}
                                            <DraggableJoint x={skeleton.lElbowPos.x} y={skeleton.lElbowPos.y} isActive={activeJoint?.name === 'lShoulder'} onMouseDown={(e) => handleJointDown(e, 'lShoulder', skeleton.lShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'lShoulder', skeleton.lShoulderBase)} />
                                            <DraggableJoint x={skeleton.lWristPos.x} y={skeleton.lWristPos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'lWrist' : 'lElbow')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'lWrist' : 'lElbow', dragType === 'IK' ? skeleton.lShoulderBase : skeleton.lElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lShoulderBase)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'lWrist' : 'lElbow', dragType === 'IK' ? skeleton.lShoulderBase : skeleton.lElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lShoulderBase)} isFK={dragType === 'FK'} />
                                            {dragType === 'FK' && <DraggableJoint x={skeleton.lHandPos.x} y={skeleton.lHandPos.y} isActive={activeJoint?.name === 'lWrist'} onMouseDown={(e) => handleJointDown(e, 'lWrist', skeleton.lWristPos)} onTouchStart={(e) => handleJointDown(e, 'lWrist', skeleton.lWristPos)} />}
                                            {dragType === 'IK' && <DraggableJoint x={skeleton.lHandPos.x} y={skeleton.lHandPos.y} isActive={activeJoint?.name === 'lWrist'} onMouseDown={(e) => handleJointDown(e, 'lWrist', skeleton.lShoulderBase, 'ik', skeleton.lShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'lWrist', skeleton.lShoulderBase, 'ik', skeleton.lShoulderBase)} isFK={false} />}

                                            {/* Right Leg */}
                                            <DraggableJoint x={skeleton.rKneePos.x} y={skeleton.rKneePos.y} isActive={activeJoint?.name === 'rHip'} onMouseDown={(e) => handleJointDown(e, 'rHip', skeleton.rHipPos)} onTouchStart={(e) => handleJointDown(e, 'rHip', skeleton.rHipPos)} />
                                            <DraggableJoint x={skeleton.rAnklePos.x} y={skeleton.rAnklePos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'rAnkle' : 'rKnee')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'rAnkle' : 'rKnee', dragType === 'IK' ? skeleton.rHipPos : skeleton.rKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rHipPos)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'rAnkle' : 'rKnee', dragType === 'IK' ? skeleton.rHipPos : skeleton.rKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rHipPos)} isFK={dragType === 'FK'} />
                                            {dragType === 'FK' && <DraggableJoint x={skeleton.rFootPos.x} y={skeleton.rFootPos.y} isActive={activeJoint?.name === 'rAnkle'} onMouseDown={(e) => handleJointDown(e, 'rAnkle', skeleton.rAnklePos)} onTouchStart={(e) => handleJointDown(e, 'rAnkle', skeleton.rAnklePos)} />}
                                            {dragType === 'IK' && <DraggableJoint x={skeleton.rFootPos.x} y={skeleton.rFootPos.y} isActive={activeJoint?.name === 'rAnkle'} onMouseDown={(e) => handleJointDown(e, 'rAnkle', skeleton.rHipPos, 'ik', skeleton.rHipPos)} onTouchStart={(e) => handleJointDown(e, 'rAnkle', skeleton.rHipPos, 'ik', skeleton.rHipPos)} isFK={false} />}

                                            {/* Left Leg */}
                                            <DraggableJoint x={skeleton.lKneePos.x} y={skeleton.lKneePos.y} isActive={activeJoint?.name === 'lHip'} onMouseDown={(e) => handleJointDown(e, 'lHip', skeleton.lHipPos)} onTouchStart={(e) => handleJointDown(e, 'lHip', skeleton.lHipPos)} />
                                            <DraggableJoint x={skeleton.lAnklePos.x} y={skeleton.lAnklePos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'lAnkle' : 'lKnee')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'lAnkle' : 'lKnee', dragType === 'IK' ? skeleton.lHipPos : skeleton.lKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lHipPos)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'lAnkle' : 'lKnee', dragType === 'IK' ? skeleton.lHipPos : skeleton.lKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lHipPos)} isFK={dragType === 'FK'} />
                                            {dragType === 'FK' && <DraggableJoint x={skeleton.lFootPos.x} y={skeleton.lFootPos.y} isActive={activeJoint?.name === 'lAnkle'} onMouseDown={(e) => handleJointDown(e, 'lAnkle', skeleton.lAnklePos)} onTouchStart={(e) => handleJointDown(e, 'lAnkle', skeleton.lAnklePos)} />}
                                            {dragType === 'IK' && <DraggableJoint x={skeleton.lFootPos.x} y={skeleton.lFootPos.y} isActive={activeJoint?.name === 'lAnkle'} onMouseDown={(e) => handleJointDown(e, 'lAnkle', skeleton.lHipPos, 'ik', skeleton.lHipPos)} onTouchStart={(e) => handleJointDown(e, 'lAnkle', skeleton.lHipPos, 'ik', skeleton.lHipPos)} isFK={false} />}
                                        </g>
                                    )}
                                </g>
                            </svg>

                            {/* Overlay Controls */}
                            <div className="absolute bottom-2 right-2 md:bottom-4 md:right-4 flex space-x-1 md:space-x-2 pointer-events-auto">
                                <div className="flex items-center bg-slate-800 rounded-lg border border-slate-700 overflow-hidden">
                                    <button onClick={() => setIsDragMode(!isDragMode)} className={`p-1.5 md:p-2 transition-all ${isDragMode ? 'bg-fuchsia-500 text-white' : 'text-slate-400 hover:text-white hover:bg-slate-700'}`} title={isDragMode ? t('dragModeOn') : t('dragModeOff')}>
                                        <Hand size={16} className="md:w-5 md:h-5" />
                                    </button>
                                    {isDragMode && (
                                        <button onClick={() => setDragType(prev => prev === 'FK' ? 'IK' : 'FK')} className="px-2 py-1.5 md:px-3 md:py-2 text-[10px] md:text-xs font-mono font-bold text-slate-300 border-l border-slate-600 hover:bg-slate-700 transition-colors w-[40px]" title={t(dragType.toLowerCase())}>
                                            {dragType}
                                        </button>
                                    )}
                                </div>
                                <div className="w-px h-6 md:h-8 bg-slate-700 mx-1"></div>
                                <button onClick={handleZoomOut} className="p-1.5 md:p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500"><ZoomOut size={16} className="md:w-5 md:h-5" /></button>
                                <button onClick={handleResetView} className="px-2 py-1.5 md:px-3 md:py-2 rounded-lg bg-slate-800 border border-slate-700 text-[10px] md:text-xs font-mono text-slate-300 min-w-[60px] md:min-w-[80px] flex items-center justify-center gap-1" title={t('resetView')}>
                                    <RotateCw size={10} /> {Math.round(zoom * 100)}%
                                </button>
                                <button onClick={handleZoomIn} className="p-1.5 md:p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:border-slate-500"><ZoomIn size={16} className="md:w-5 md:h-5" /></button>
                                <div className="w-px h-6 md:h-8 bg-slate-700 mx-1"></div>
                                <button onClick={() => setShowGrid(!showGrid)} className={`p-1.5 md:p-2 rounded-lg border ${showGrid ? 'bg-cyan-500/20 border-cyan-500 text-cyan-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}><Grid size={16} className="md:w-5 md:h-5" /></button>
                            </div>
                        </div>
                    </div>

                    {/* Timeline */}
                    <div className="w-full bg-slate-900/90 p-3 border-t border-slate-800 flex-shrink-0">
                    <div className="flex flex-wrap justify-between items-center mb-2 gap-2">
                        <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">{t('timeline')} ({timeline.length})</span>
                        <div className="flex items-center space-x-2 md:space-x-4">
                        <button onClick={handleAIGenerate} className="flex items-center space-x-1 px-2 py-1 bg-fuchsia-600 hover:bg-fuchsia-500 text-white rounded text-[10px] font-bold transition-all shadow-[0_0_10px_rgba(192,38,211,0.4)]"><Sparkles size={10} /><span>{t('ai')}</span></button>
                        <div className="w-px h-3 bg-slate-700 hidden md:block"></div>
                        <div className="hidden md:flex items-center space-x-1">
                            <Settings size={10} className="text-slate-500" />
                            <select value={pose.easing || 'Smooth (流暢)'} onChange={(e) => updatePose('easing', e.target.value)} className="bg-slate-800 border border-slate-700 text-[10px] text-white rounded px-1 py-0.5 focus:outline-none max-w-[80px]">
                            {Object.keys(EASING_FUNCTIONS).map(name => (<option key={name} value={name}>{name.split(' ')[0]}</option>))}
                            </select>
                        </div>
                        <div className="flex items-center space-x-1">
                            <label className="text-[10px] text-slate-500">{t('bpm')}</label>
                            <input type="number" value={bpm} onChange={(e) => setBpm(Number(e.target.value))} className="w-8 md:w-10 bg-slate-800 border border-slate-700 rounded px-1 text-[10px] text-center text-white" />
                        </div>
                        </div>
                    </div>
                    <div className="w-full mb-2 px-1"><input type="range" min={0} max={Math.max(0, timeline.length - 1)} value={currentFrameIndex} onChange={handleTimelineScrub} className="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500 hover:accent-cyan-400 block"/></div>
                    <div className="flex items-center space-x-2 overflow-x-auto pb-1 custom-scrollbar no-scrollbar-mobile">
                        <button onClick={() => setIsPlaying(!isPlaying)} className={`p-2.5 rounded-full flex-shrink-0 transition-all ${isPlaying ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'} text-white shadow-lg`}>{isPlaying ? <Square fill="currentColor" size={12} /> : <Play fill="currentColor" size={12} />}</button>
                        {timeline.map((_, idx) => (
                            <button key={idx} onClick={() => jumpToFrame(idx)} className={`w-8 h-12 md:w-10 md:h-14 flex-shrink-0 rounded border-2 transition-all flex flex-col items-center justify-center relative ${currentFrameIndex === idx ? 'border-cyan-500 bg-cyan-500/20 scale-110 shadow-[0_0_10px_rgba(6,182,212,0.3)]' : 'border-slate-700 bg-slate-800 hover:border-slate-500'}`}>
                            <span className={`text-[10px] font-mono ${currentFrameIndex === idx ? 'text-cyan-300' : 'text-slate-500'}`}>{idx + 1}</span>
                            </button>
                        ))}
                        <button onClick={addKeyframe} className="w-8 h-12 md:w-10 md:h-14 flex-shrink-0 rounded border-2 border-dashed border-slate-600 hover:border-cyan-500 text-slate-600 hover:text-cyan-500 flex items-center justify-center transition-colors"><Plus size={14} /></button>
                    </div>
                    <div className="flex justify-between mt-1 pt-1 border-t border-slate-800/50">
                        <button onClick={deleteKeyframe} className="flex items-center text-[10px] text-red-400 px-2 py-1"><Trash2 size={10} className="mr-1"/> {t('delete')}</button>
                        <button onClick={updateKeyframe} className="flex items-center text-[10px] text-cyan-400 px-2 py-1"><Layers size={10} className="mr-1"/> {t('update')}</button>
                    </div>
                    </div>
                </div>

                {/* --- BOTTOM/RIGHT PANEL --- */}
                <div className="w-full md:w-[350px] h-[45%] md:h-full bg-slate-900/95 md:bg-slate-900/80 overflow-y-auto md:border-l border-t md:border-t-0 border-slate-800 custom-scrollbar shadow-[0_-5px_20px_rgba(0,0,0,0.5)] z-20 flex-shrink-0">
                    <div className="p-4 md:p-6">
                        <div className="mb-6">
                        <h2 className="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center"><RotateCcw className="mr-2" size={12}/> {t('manage')}</h2>
                        
                        {/* Custom Preset Input */}
                        <div className="mb-4 p-3 bg-slate-800/50 rounded-lg border border-slate-700">
                            <label className="text-[10px] text-slate-400 mb-1 block">{t('savePreset')}</label>
                            <div className="flex gap-2">
                                <input type="text" value={presetName} onChange={(e) => setPresetName(e.target.value)} placeholder={t('enterName')} className="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-[10px] md:text-xs text-white focus:outline-none focus:border-cyan-500 placeholder-slate-600" />
                                <button onClick={handleSaveCustomPreset} className="px-2 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-[10px] md:text-xs flex items-center transition-colors"><Save size={12} className="mr-1" />{t('save')}</button>
                            </div>
                        </div>

                        <div className="mb-3">
                            <select value={selectedPreset} onChange={handlePresetChange} className="w-full bg-slate-800 border border-slate-700 text-white text-[10px] md:text-xs rounded px-2 py-2 focus:outline-none focus:border-cyan-500" disabled={isPlaying}>
                            <option value="" disabled>{t('selectPreset')}</option>
                            <optgroup label={t('presets')}>{Object.keys(PRESETS).map(key => (<option key={key} value={key}>{t(`p_${key}`)}</option>))}</optgroup>
                            {Object.keys(customPresets).length > 0 && <optgroup label={t('custom')}>{Object.keys(customPresets).map(key => (<option key={key} value={key}>{key}</option>))}</optgroup>}
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleExport} className="flex-1 flex items-center justify-center space-x-1 px-2 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-[10px] md:text-xs text-cyan-400 font-medium transition-colors"><Download size={12} /><span>{t('export')}</span></button>
                            <button onClick={() => fileInputRef.current.click()} className="flex-1 flex items-center justify-center space-x-1 px-2 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded text-[10px] md:text-xs text-fuchsia-400 font-medium transition-colors"><Upload size={12} /><span>{t('import')}</span></button>
                            <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                        </div>
                        </div>

                        <div className="mb-6 border-t border-slate-800 pt-4">
                            <h2 className="text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 flex items-center"><Users className="mr-2" size={12}/> {t('formation')}</h2>
                            <select value={formationType} onChange={(e) => setFormationType(e.target.value)} className="w-full bg-slate-800 border border-slate-700 text-white text-[10px] md:text-xs rounded px-2 py-2 focus:outline-none focus:border-cyan-500">
                                {['single', 'duo', 'trio', 'triangle', 'row', 'grid'].map(f => (
                                    <option key={f} value={f}>{t(`f_${f}`)}</option>
                                ))}
                            </select>
                        </div>

                        <div className="space-y-6 pb-8 border-t border-slate-800 pt-4">
                        <div>
                            <h3 className="text-xs font-bold text-slate-300 mb-3 border-b border-slate-700/50 pb-1 flex justify-between items-center"><span>{t('easing')}</span><Settings size={12} className="text-slate-500"/></h3>
                            <select value={pose.easing || 'Smooth (流暢)'} onChange={(e) => updatePose('easing', e.target.value)} className="w-full bg-slate-800 border border-slate-700 text-white text-[10px] md:text-xs rounded px-2 py-2 focus:outline-none focus:border-cyan-500">
                            {Object.keys(EASING_FUNCTIONS).map(name => (<option key={name} value={name}>{name}</option>))}
                            </select>
                        </div>

                        <div>
                            <h3 className="text-xs font-bold text-slate-300 mb-3 border-b border-slate-700/50 pb-1 flex justify-between items-center"><span>{t('body')}</span><Move size={12} className="text-slate-500"/></h3>
                            <div className="grid grid-cols-1 gap-1">
                            <SliderControl label={t('waist')} value={pose.waist || 0} onChange={(v) => updatePose('waist', v)} min={-45} max={45} step={1} snap={0} />
                            <SliderControl label={t('bodyX')} value={pose.bodyX || 0} onChange={(v) => updatePose('bodyX', v)} min={-100} max={100} step={1} snap={0} unit="px"/>
                            <SliderControl label={t('bodyY')} value={pose.bodyY || 0} onChange={(v) => updatePose('bodyY', v)} min={-100} max={100} step={1} snap={0} unit="px"/>
                            </div>
                        </div>
                        <div>
                            <h3 className="text-xs font-bold text-slate-300 mb-3 border-b border-slate-700/50 pb-1 flex justify-between items-center"><span>{t('head')}</span><User size={12} className="text-slate-500"/></h3>
                            <div className="grid grid-cols-1 gap-1">
                            <SliderControl label={t('headTilt')} value={pose.headTilt || 0} onChange={(v) => updatePose('headTilt', v)} min={-45} max={45} step={1} snap={0} />
                            <SliderControl label={t('headSlide')} value={pose.headSlide || 0} onChange={(v) => updatePose('headSlide', v)} min={-30} max={30} step={1} snap={0} unit="px" />
                            </div>
                        </div>
                        <div><h3 className="text-xs font-bold text-cyan-400 mb-3 border-b border-cyan-900/50 pb-1 flex justify-between items-center"><span>{t('rArm')}</span><div className="w-1.5 h-1.5 rounded-full bg-cyan-500"></div></h3><SliderControl label={t('shoulder')} value={pose.lShoulder} onChange={(v) => updatePose('lShoulder', v)} /><SliderControl label={t('elbow')} value={pose.lElbow} onChange={(v) => updatePose('lElbow', v)} /><SliderControl label={t('wrist')} value={pose.lWrist} onChange={(v) => updatePose('lWrist', v)} /></div>
                        <div><h3 className="text-xs font-bold text-cyan-600 mb-3 border-b border-cyan-900/30 pb-1 flex justify-between items-center"><span>{t('rLeg')}</span><div className="w-1.5 h-1.5 rounded-full bg-cyan-700"></div></h3><SliderControl label={t('hip')} value={pose.lHip ?? 90} onChange={(v) => updatePose('lHip', v)} /><SliderControl label={t('knee')} value={pose.lKnee ?? 90} onChange={(v) => updatePose('lKnee', v)} /><SliderControl label={t('ankle')} value={pose.lAnkle ?? 0} onChange={(v) => updatePose('lAnkle', v)} /></div>
                        <div><h3 className="text-xs font-bold text-fuchsia-400 mb-3 border-b border-fuchsia-900/50 pb-1 flex justify-between items-center"><span>{t('lArm')}</span><div className="w-1.5 h-1.5 rounded-full bg-fuchsia-500"></div></h3><SliderControl label={t('shoulder')} value={pose.rShoulder} onChange={(v) => updatePose('rShoulder', v)} /><SliderControl label={t('elbow')} value={pose.rElbow} onChange={(v) => updatePose('rElbow', v)} /><SliderControl label={t('wrist')} value={pose.rWrist} onChange={(v) => updatePose('rWrist', v)} /></div>
                        <div><h3 className="text-xs font-bold text-fuchsia-600 mb-3 border-b border-fuchsia-900/30 pb-1 flex justify-between items-center"><span>{t('lLeg')}</span><div className="w-1.5 h-1.5 rounded-full bg-fuchsia-700"></div></h3><SliderControl label={t('hip')} value={pose.rHip ?? 90} onChange={(v) => updatePose('rHip', v)} /><SliderControl label={t('knee')} value={pose.rKnee ?? 90} onChange={(v) => updatePose('rKnee', v)} /><SliderControl label={t('ankle')} value={pose.rAnkle ?? 180} onChange={(v) => updatePose('rAnkle', v)} /></div>
                        </div>
                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TuttingSimulator />);
    </script>
