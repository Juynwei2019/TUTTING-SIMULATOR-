                                    <div className={`flex items-center ${theme === 'minimalist' ? 'bg-neutral-950 border-neutral-800' : 'bg-slate-900 border-slate-700'} border rounded px-2 w-20`}>
                                        <Clock size={10} className="text-slate-500 mr-1"/>
                                        <input type="number" value={pose.duration || 1} onChange={(e) => updatePose('duration', Math.max(0.1, parseFloat(e.target.value)))} step={0.1} className={`w-full bg-transparent text-[10px] text-right ${theme === 'minimalist' ? 'text-white' : 'text-cyan-400'} focus:outline-none`} />
                                        <span className="text-[8px] text-slate-600 ml-1">s</span>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    <input type="text" value={presetName} onChange={(e) => setPresetName(e.target.value)} placeholder={t('enterName')} className={`flex-1 ${theme === 'minimalist' ? 'bg-neutral-950 border-neutral-800 text-neutral-200 focus:border-white' : 'bg-slate-900 border-slate-700 text-slate-200 focus:border-fuchsia-500/50'} border rounded px-2 py-1.5 text-[10px] focus:outline-none placeholder-slate-600`} />
                                    <button onClick={handleSaveCustomPreset} className={`px-3 ${theme === 'minimalist' ? 'bg-neutral-800 hover:bg-white text-white hover:text-black' : 'bg-slate-700 hover:bg-fuchsia-600 text-white'} rounded text-[10px] transition-colors`}><Save size={12}/></button>
                                </div>
                            </div>
                        </div>

                        {/* Scrollable Controls Area (Accordion) */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-0">
                            
                            {/* Body & Head Section */}
                            <AccordionSection title={t('body')} icon={Move} isOpen={openSections.body} onToggle={() => toggleSection('body')} color="slate" theme={theme}>
                                <div className="space-y-3 pt-2">
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => setIsHandSync(!isHandSync)} className={`py-1.5 px-2 rounded border text-[10px] font-bold flex items-center justify-center space-x-1 transition-all ${isHandSync ? (theme === 'minimalist' ? 'bg-white text-black border-white' : 'bg-cyan-500/20 border-cyan-500 text-cyan-400') : (theme === 'minimalist' ? 'bg-neutral-900 border-neutral-800 text-neutral-500 hover:border-neutral-600' : 'bg-slate-800 border-slate-700 text-slate-500 hover:border-slate-600')}`}>
                                            <LinkIcon size={12} /><span>{t('handSync')}</span>
                                        </button>
                                        <div className={`flex items-center justify-center space-x-1 ${theme === 'minimalist' ? 'bg-neutral-900 border-neutral-800' : 'bg-slate-800 border-slate-700'} border rounded`}>
                                            <Anchor size={12} className="text-slate-500"/>
                                            <span className="text-[10px] text-slate-500 font-bold">FIXED</span>
                                        </div>
                                    </div>
                                    
                                    {/* Fixed Mode toggles simplified */}
                                    <div className={`grid grid-cols-4 gap-1 p-1 ${theme === 'minimalist' ? 'bg-neutral-900/50 border-neutral-800' : 'bg-slate-800/50 border-slate-700/30'} rounded border`}>
                                        {['lWrist', 'rWrist', 'lAnkle', 'rAnkle'].map(joint => (
                                            <button 
                                                key={joint}
                                                onClick={() => setFixedJoints(p => ({...p, [joint]: !p[joint]}))} 
                                                className={`h-6 rounded text-[9px] font-bold border transition-all ${fixedJoints[joint] ? (joint.startsWith('l') ? (theme === 'minimalist' ? 'bg-white text-black border-white' : 'bg-cyan-500/20 border-cyan-500 text-cyan-400') : (theme === 'minimalist' ? 'bg-neutral-700 text-white border-neutral-600' : 'bg-fuchsia-500/20 border-fuchsia-500 text-fuchsia-400')) : 'bg-transparent border-transparent text-slate-600 hover:bg-white/5'}`}
                                            >
                                                {joint.startsWith('l') ? 'L' : 'R'} {joint.includes('Wrist') ? 'Hand' : 'Foot'}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="space-y-1">
                                        <SliderControl label={t('waist')} value={pose.waist || 0} onChange={(v) => updatePose('waist', v)} min={-45} max={45} step={1} snap={0} accentColor="slate" theme={theme} />
                                        <SliderControl label={t('bodyX')} value={pose.bodyX || 0} onChange={(v) => updatePose('bodyX', v)} min={-100} max={100} step={1} snap={0} unit="px" accentColor="slate" theme={theme} />
                                        <SliderControl label={t('bodyY')} value={pose.bodyY || 0} onChange={(v) => updatePose('bodyY', v)} min={-100} max={100} step={1} snap={0} unit="px" accentColor="slate" theme={theme} />
                                    </div>
                                    <div className={`border-t ${theme === 'minimalist' ? 'border-neutral-800' : 'border-slate-800/50'} pt-2 space-y-1`}>
                                        <SliderControl label={t('headTilt')} value={pose.headTilt || 0} onChange={(v) => updatePose('headTilt', v)} min={-45} max={45} step={1} snap={0} accentColor="slate" theme={theme} />
                                        <SliderControl label={t('headSlide')} value={pose.headSlide || 0} onChange={(v) => updatePose('headSlide', v)} min={-30} max={30} step={1} snap={0} unit="px" accentColor="slate" theme={theme} />
                                    </div>
                                </div>
                            </AccordionSection>

                            {/* Left Arm (Cyan) */}
                            <AccordionSection title={t('lArm')} icon={User} isOpen={openSections.lArm} onToggle={() => toggleSection('lArm')} color="cyan" theme={theme}>
                                <div className={`space-y-1 pt-2 border-l-2 ${theme === 'minimalist' ? 'border-white' : 'border-cyan-500/20'} pl-2`}>
                                    <div className="flex items-center justify-between mb-2 pr-2">
                                        <span className={`text-[10px] ${theme === 'minimalist' ? 'text-white' : 'text-cyan-400'} font-bold uppercase`}>{t('depth')}</span>
                                        <div className={`flex ${theme === 'minimalist' ? 'bg-neutral-800 border-neutral-700' : 'bg-slate-800 border-slate-700'} rounded border p-0.5`}>
                                            <button 
                                                onClick={() => updatePose('lArmZ', 'back')} 
                                                className={`px-2 py-0.5 rounded text-[9px] transition-colors ${pose.lArmZ === 'back' ? (theme === 'minimalist' ? 'bg-white text-black' : 'bg-cyan-600 text-white') : 'text-slate-400 hover:text-white'}`}
                                                title={t('back')}
                                            >
                                                <SendToBack size={12} />
                                            </button>
                                            <button 
                                                onClick={() => updatePose('lArmZ', 'front')} 
                                                className={`px-2 py-0.5 rounded text-[9px] transition-colors ${(!pose.lArmZ || pose.lArmZ === 'front') ? (theme === 'minimalist' ? 'bg-white text-black' : 'bg-cyan-600 text-white') : 'text-slate-400 hover:text-white'}`}
                                                title={t('front')}
                                            >
                                                <BringToFront size={12} />
                                            </button>
                                        </div>
                                    </div>
                                    <SliderControl label={t('shoulder')} value={pose.lShoulder} onChange={(v) => updatePose('lShoulder', v)} accentColor="cyan" theme={theme} />
                                    <SliderControl label={t('elbow')} value={pose.lElbow} onChange={(v) => updatePose('lElbow', v)} accentColor="cyan" theme={theme} />
                                    <SliderControl label={t('wrist')} value={pose.lWrist} onChange={(v) => updatePose('lWrist', v)} accentColor="cyan" theme={theme} />
                                </div>
                            </AccordionSection>

                            {/* Right Arm (Fuchsia) */}
                            <AccordionSection title={t('rArm')} icon={User} isOpen={openSections.rArm} onToggle={() => toggleSection('rArm')} color="fuchsia" theme={theme}>
                                <div className={`space-y-1 pt-2 border-l-2 ${theme === 'minimalist' ? 'border-neutral-600' : 'border-fuchsia-500/20'} pl-2`}>
                                    <div className="flex items-center justify-between mb-2 pr-2">
                                        <span className={`text-[10px] ${theme === 'minimalist' ? 'text-neutral-500' : 'text-fuchsia-400'} font-bold uppercase`}>{t('depth')}</span>
                                        <div className={`flex ${theme === 'minimalist' ? 'bg-neutral-800 border-neutral-700' : 'bg-slate-800 border-slate-700'} rounded border p-0.5`}>
                                            <button 
                                                onClick={() => updatePose('rArmZ', 'back')} 
                                                className={`px-2 py-0.5 rounded text-[9px] transition-colors ${pose.rArmZ === 'back' ? (theme === 'minimalist' ? 'bg-neutral-600 text-white' : 'bg-fuchsia-600 text-white') : 'text-slate-400 hover:text-white'}`}
                                                title={t('back')}
                                            >
                                                <SendToBack size={12} />
                                            </button>
                                            <button 
                                                onClick={() => updatePose('rArmZ', 'front')} 
                                                className={`px-2 py-0.5 rounded text-[9px] transition-colors ${(!pose.rArmZ || pose.rArmZ === 'front') ? (theme === 'minimalist' ? 'bg-neutral-600 text-white' : 'bg-fuchsia-600 text-white') : 'text-slate-400 hover:text-white'}`}
                                                title={t('front')}
                                            >
                                                <BringToFront size={12} />
                                            </button>
                                        </div>
                                    </div>
                                    <SliderControl label={t('shoulder')} value={pose.rShoulder} onChange={(v) => updatePose('rShoulder', v)} accentColor="fuchsia" theme={theme} />
                                    <SliderControl label={t('elbow')} value={pose.rElbow} onChange={(v) => updatePose('rElbow', v)} accentColor="fuchsia" theme={theme} />
                                    <SliderControl label={t('wrist')} value={pose.rWrist} onChange={(v) => updatePose('rWrist', v)} accentColor="fuchsia" theme={theme} />
                                </div>
                            </AccordionSection>

                            {/* Left Leg (Cyan) */}
                            <AccordionSection title={t('lLeg')} icon={Move} isOpen={openSections.lLeg} onToggle={() => toggleSection('lLeg')} color="cyan" theme={theme}>
                                <div className={`space-y-1 pt-2 border-l-2 ${theme === 'minimalist' ? 'border-white' : 'border-cyan-900/20'} pl-2`}>
                                    <SliderControl label={t('hip')} value={pose.lHip ?? 90} onChange={(v) => updatePose('lHip', v)} accentColor="cyan" theme={theme} />
                                    <SliderControl label={t('knee')} value={pose.lKnee ?? 90} onChange={(v) => updatePose('lKnee', v)} accentColor="cyan" theme={theme} />
                                    <SliderControl label={t('ankle')} value={pose.lAnkle ?? 0} onChange={(v) => updatePose('lAnkle', v)} accentColor="cyan" theme={theme} />
                                </div>
                            </AccordionSection>

                            {/* Right Leg (Fuchsia) */}
                            <AccordionSection title={t('rLeg')} icon={Move} isOpen={openSections.rLeg} onToggle={() => toggleSection('rLeg')} color="fuchsia" theme={theme}>
                                <div className={`space-y-1 pt-2 border-l-2 ${theme === 'minimalist' ? 'border-neutral-600' : 'border-fuchsia-900/20'} pl-2`}>
                                    <SliderControl label={t('hip')} value={pose.rHip ?? 90} onChange={(v) => updatePose('rHip', v)} accentColor="fuchsia" theme={theme} />
                                    <SliderControl label={t('knee')} value={pose.rKnee ?? 90} onChange={(v) => updatePose('rKnee', v)} accentColor="fuchsia" theme={theme} />
                                    <SliderControl label={t('ankle')} value={pose.rAnkle ?? 180} onChange={(v) => updatePose('rAnkle', v)} accentColor="fuchsia" theme={theme} />
                                </div>
                            </AccordionSection>

                            {/* Formation Settings */}
                            <AccordionSection title={t('formation')} icon={Users} isOpen={openSections.formation} onToggle={() => toggleSection('formation')} color="slate" theme={theme}>
                                <div className="pt-2 pb-4">
                                    <select value={formationType} onChange={(e) => setFormationType(e.target.value)} className={`w-full ${theme === 'minimalist' ? 'bg-neutral-900 border-neutral-700 text-neutral-300 focus:border-white' : 'bg-slate-800 border-slate-700 text-slate-300 focus:border-slate-500'} border text-xs rounded px-2 py-2 focus:outline-none`}>
                                        {['single', 'duo', 'trio', 'triangle', 'row', 'grid'].map(f => (
                                            <option key={f} value={f}>{t(`f_${f}`)}</option>
                                        ))}
                                    </select>
                                </div>
                            </AccordionSection>

                        </div>
                        
                        {/* Bottom Action Bar */}
                        <div className={`p-3 border-t ${currentThemeConfig.borderColor} ${currentThemeConfig.headerBg} backdrop-blur-sm`}>
                            <button onClick={updateKeyframe} className={`w-full py-2 ${theme === 'minimalist' ? 'bg-white hover:bg-neutral-200 text-black shadow-neutral-900/20' : 'bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white shadow-cyan-900/20'} rounded-md text-xs font-bold tracking-wider uppercase transition-all shadow-lg flex items-center justify-center`}>
                                <Edit size={14} className="mr-2" /> {t('modify')}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TuttingSimulator />);
    </script>
</body>

</html>
