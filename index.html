            tutting_l: { duration: 1, easing: 'Smooth (流暢)', bodyX: 20, bodyY: 0, waist: -10, headTilt: -10, headSlide: 15, lShoulder: 180, lElbow: 90, lWrist: 180, rShoulder: 90, rElbow: 180, rWrist: 0, lHip: 90, lKnee: 90, lAnkle: 0, rHip: 90, rKnee: 90, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            cobra: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: 20, waist: 20, headTilt: 0, headSlide: -10, lShoulder: 315, lElbow: 135, lWrist: 270, rShoulder: 225, rElbow: 225, rWrist: 90, lHip: 70, lKnee: 45, lAnkle: 90, rHip: 110, rKnee: 135, rAnkle: 90, lArmZ: 'front', rArmZ: 'front' },
            pharaoh: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: 0, waist: 0, headTilt: 0, headSlide: 0, lShoulder: 0, lElbow: 90, lWrist: 180, rShoulder: 180, rElbow: 270, rWrist: 0, lHip: 90, lKnee: 90, lAnkle: 0, rHip: 90, rKnee: 90, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            diamond: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: 0, waist: 0, headTilt: 0, headSlide: 0, lShoulder: 315, lElbow: 225, lWrist: 135, rShoulder: 225, rElbow: 315, rWrist: 45, lHip: 80, lKnee: 80, lAnkle: 0, rHip: 100, rKnee: 100, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            stairs: { duration: 1, easing: 'Smooth (流暢)', bodyX: -10, bodyY: 0, waist: 10, headTilt: -5, headSlide: 10, lShoulder: 0, lElbow: 90, lWrist: 0, rShoulder: 180, rElbow: 270, rWrist: 180, lHip: 90, lKnee: 70, lAnkle: 0, rHip: 90, rKnee: 110, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            frame: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: 0, waist: 0, headTilt: 0, headSlide: 0, lShoulder: 270, lElbow: 180, lWrist: 90, rShoulder: 270, rElbow: 0, rWrist: 90, lHip: 90, lKnee: 90, lAnkle: 0, rHip: 90, rKnee: 90, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            wings: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: -20, waist: 0, headTilt: 0, headSlide: 0, lShoulder: 315, lElbow: 315, lWrist: 315, rShoulder: 225, rElbow: 225, rWrist: 225, lHip: 100, lKnee: 100, lAnkle: 0, rHip: 80, rKnee: 80, rAnkle: 180, lArmZ: 'front', rArmZ: 'front' },
            zig_zag: { duration: 1, easing: 'Smooth (流暢)', bodyX: 0, bodyY: 0, waist: -15, headTilt: 10, headSlide: -10, lShoulder: 0, lElbow: 90, lWrist: 0, rShoulder: 180, rElbow: 270, rWrist: 180, lHip: 80, lKnee: 45, lAnkle: 90, rHip: 100, rKnee: 135, rAnkle: 90, lArmZ: 'front', rArmZ: 'front' }
        };

        const FORMATIONS = {
            'single': [
                { id: 0, x: 0, y: 0, scale: 1, opacity: 1, main: true }
            ],
            'duo': [
                { id: 1, x: -80, y: 0, scale: 0.9, opacity: 0.9 },
                { id: 0, x: 80, y: 0, scale: 0.9, opacity: 0.9, main: true }
            ],
            'trio': [
                { id: 1, x: -120, y: 0, scale: 0.8, opacity: 0.8 },
                { id: 0, x: 0, y: 0, scale: 1, opacity: 1, main: true },
                { id: 2, x: 120, y: 0, scale: 0.8, opacity: 0.8 }
            ],
            'triangle': [
                { id: 1, x: -100, y: -50, scale: 0.7, opacity: 0.7 },
                { id: 2, x: 100, y: -50, scale: 0.7, opacity: 0.7 },
                { id: 0, x: 0, y: 50, scale: 1, opacity: 1, main: true }
            ],
            'row': [
                { id: 1, x: -180, y: 0, scale: 0.7, opacity: 0.7 },
                { id: 2, x: -90, y: 0, scale: 0.8, opacity: 0.8 },
                { id: 0, x: 0, y: 0, scale: 1, opacity: 1, main: true },
                { id: 3, x: 90, y: 0, scale: 0.8, opacity: 0.8 },
                { id: 4, x: 180, y: 0, scale: 0.7, opacity: 0.7 }
            ],
            'grid': [
                { id: 1, x: -130, y: -120, scale: 0.5, opacity: 0.5 }, { id: 2, x: 0, y: -120, scale: 0.5, opacity: 0.5 }, { id: 3, x: 130, y: -120, scale: 0.5, opacity: 0.5 },
                { id: 4, x: -130, y: 0, scale: 0.7, opacity: 0.7 }, { id: 0, x: 0, y: 0, scale: 1, opacity: 1, main: true }, { id: 5, x: 130, y: 0, scale: 0.7, opacity: 0.7 },
                { id: 6, x: -130, y: 120, scale: 0.9, opacity: 0.9 }, { id: 7, x: 0, y: 120, scale: 0.9, opacity: 0.9 }, { id: 8, x: 130, y: 120, scale: 0.9, opacity: 0.9 }
            ]
        };

        const toRad = (deg) => (deg * Math.PI) / 180;
        const toDeg = (rad) => (rad * 180) / Math.PI;

        const calculateEndPoint = (startX, startY, angle, length) => {
            return {
                x: startX + Math.cos(toRad(angle)) * length,
                y: startY + Math.sin(toRad(angle)) * length
            };
        };

        const shortAngleDist = (a0, a1) => {
            const max = 360;
            const da = (a1 - a0) % max;
            return (2 * da) % max - da;
        };

        const interpolateAngle = (start, end, t) => {
            const diff = shortAngleDist(start, end);
            let val = start + diff * t;
            val = val % 360;
            if (val < 0) val += 360;
            return val;
        };

        const interpolateLinear = (start, end, t) => {
            return start + (end - start) * t;
        };

        const interpolatePose = (poseA, poseB, t) => {
            const newPose = {};
            Object.keys(poseA).forEach(key => {
                if (key === 'easing') return;
                if (key === 'lArmZ' || key === 'rArmZ') {
                    newPose[key] = t < 0.5 ? poseA[key] : (poseB[key] || poseA[key]);
                    return;
                }
                const endVal = poseB[key] !== undefined ? poseB[key] : poseA[key];
                if (['headSlide', 'bodyX', 'bodyY', 'duration'].includes(key)) {
                    newPose[key] = interpolateLinear(poseA[key], endVal, t);
                } else {
                    newPose[key] = interpolateAngle(poseA[key], endVal, t);
                }
            });
            newPose.lArmZ = newPose.lArmZ || 'front';
            newPose.rArmZ = newPose.rArmZ || 'front';
            return newPose;
        };

        const solveTwoJointIK = (target, origin, len1, len2, currentA1, currentA2) => {
            const dx = target.x - origin.x;
            const dy = target.y - origin.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const d = Math.min(dist, len1 + len2 - 0.1);
            const baseAngle = Math.atan2(dy, dx);
            const cosAlpha = (len1 * len1 + d * d - len2 * len2) / (2 * len1 * d);
            const alpha = Math.acos(Math.max(-1, Math.min(1, cosAlpha)));
            const theta1_A = baseAngle - alpha;
            const theta1_B = baseAngle + alpha;
            const elbow_A = {
                x: origin.x + Math.cos(theta1_A) * len1,
                y: origin.y + Math.sin(theta1_A) * len1
            };
            const elbow_B = {
                x: origin.x + Math.cos(theta1_B) * len1,
                y: origin.y + Math.sin(theta1_B) * len1
            };
            const theta2_A = Math.atan2(target.y - elbow_A.y, target.x - elbow_A.x);
            const theta2_B = Math.atan2(target.y - elbow_B.y, target.x - elbow_B.x);
            const toPosDeg = (rad) => {
                let deg = toDeg(rad) % 360;
                return deg < 0 ? deg + 360 : deg;
            };
            const deg1A = toPosDeg(theta1_A); const deg2A = toPosDeg(theta2_A);
            const deg1B = toPosDeg(theta1_B); const deg2B = toPosDeg(theta2_B);
            const distA = Math.abs(shortAngleDist(currentA1, deg1A)) + Math.abs(shortAngleDist(currentA2, deg2A));
            const distB = Math.abs(shortAngleDist(currentA1, deg1B)) + Math.abs(shortAngleDist(currentA2, deg2B));
            return distA < distB ? [deg1A, deg2A] : [deg1B, deg2B];
        };

        const calculateSkeleton = (pose) => {
            const baseCenterX = 0;
            const baseCenterY = 0;
            const hipCenterY = 0 + (pose.bodyY || 0);
            const hipCenterX = 0 + (pose.bodyX || 0);
            const hipWidth = 25;
            const shoulderWidth = 40;
            const headRadius = 25;
            const waistAngle = (pose.waist || 0) - 90;
            const shoulderCenter = calculateEndPoint(hipCenterX, hipCenterY, waistAngle, SEGMENT_LENGTHS.torso);
            const rShoulderBase = calculateEndPoint(shoulderCenter.x, shoulderCenter.y, waistAngle - 90, shoulderWidth);
            const lShoulderBase = calculateEndPoint(shoulderCenter.x, shoulderCenter.y, waistAngle + 90, shoulderWidth);
            const neckBase = shoulderCenter;
            const headSlide = pose.headSlide || 0;
            const headCenterBase = calculateEndPoint(neckBase.x, neckBase.y, waistAngle, SEGMENT_LENGTHS.neck);
            const slideX = Math.cos(toRad(waistAngle + 90)) * headSlide;
            const slideY = Math.sin(toRad(waistAngle + 90)) * headSlide;
            const headCenterX = headCenterBase.x + slideX;
            const headCenterY = headCenterBase.y + slideY;
            let displayTilt = (pose.headTilt || 0) + (pose.waist || 0);
            if (displayTilt > 180) displayTilt -= 360;
            const tiltHandleDist = headRadius + 15;
            const tiltHandleX = headCenterX + Math.cos(toRad(displayTilt - 90)) * tiltHandleDist;
            const tiltHandleY = headCenterY + Math.sin(toRad(displayTilt - 90)) * tiltHandleDist;
            const lElbowPos = calculateEndPoint(lShoulderBase.x, lShoulderBase.y, pose.lShoulder, SEGMENT_LENGTHS.upperArm);
            const lWristPos = calculateEndPoint(lElbowPos.x, lElbowPos.y, pose.lElbow, SEGMENT_LENGTHS.forearm);
            const lHandPos = calculateEndPoint(lWristPos.x, lWristPos.y, pose.lWrist, SEGMENT_LENGTHS.hand);
            const rElbowPos = calculateEndPoint(rShoulderBase.x, rShoulderBase.y, pose.rShoulder, SEGMENT_LENGTHS.upperArm);
            const rWristPos = calculateEndPoint(rElbowPos.x, rElbowPos.y, pose.rElbow, SEGMENT_LENGTHS.forearm);
            const rHandPos = calculateEndPoint(rWristPos.x, rWristPos.y, pose.rWrist, SEGMENT_LENGTHS.hand);
            const lHipPos = { x: hipCenterX + hipWidth, y: hipCenterY };
            const lKneePos = calculateEndPoint(lHipPos.x, lHipPos.y, pose.lHip ?? 90, SEGMENT_LENGTHS.thigh);
            const lAnklePos = calculateEndPoint(lKneePos.x, lKneePos.y, pose.lKnee ?? 90, SEGMENT_LENGTHS.shin);
            const lFootPos = calculateEndPoint(lAnklePos.x, lAnklePos.y, pose.lAnkle ?? 0, SEGMENT_LENGTHS.foot);
            const rHipPos = { x: hipCenterX - hipWidth, y: hipCenterY };
            const rKneePos = calculateEndPoint(rHipPos.x, rHipPos.y, pose.rHip ?? 90, SEGMENT_LENGTHS.thigh);
            const rAnklePos = calculateEndPoint(rKneePos.x, rKneePos.y, pose.rKnee ?? 90, SEGMENT_LENGTHS.shin);
            const rFootPos = calculateEndPoint(rAnklePos.x, rAnklePos.y, pose.rAnkle ?? 180, SEGMENT_LENGTHS.foot);
            return {
                hipCenterX, hipCenterY, shoulderCenter,
                rShoulderBase, lShoulderBase,
                headCenterX, headCenterY, headRadius, displayTilt, neckBase,
                tiltHandleX, tiltHandleY,
                rElbowPos, rWristPos, rHandPos,
                lElbowPos, lWristPos, lHandPos,
                rHipPos, rKneePos, rAnklePos, rFootPos,
                lHipPos, lKneePos, lAnklePos, lFootPos
            };
        };

        // --- Components ---

        const SliderControl = ({ label, value, onChange, min = 0, max = 360, step = 1, snap = 90, unit = "°", accentColor = "cyan", theme = "cyberpunk" }) => {
            const [localVal, setLocalVal] = useState(value);
            useEffect(() => { setLocalVal(Math.round(value)); }, [value]);
            const handleInput = (e) => {
                const v = e.target.value;
                setLocalVal(v);
                const num = parseFloat(v);
                if (!isNaN(num)) onChange(num);
            };
            
            let accentClass = "";
            let textClass = "";
            
            if (theme === 'minimalist') {
                accentClass = accentColor === 'cyan' ? "accent-white hover:accent-neutral-300" : (accentColor === 'fuchsia' ? "accent-neutral-500 hover:accent-neutral-400" : "accent-neutral-600");
                textClass = accentColor === 'cyan' ? "text-white" : (accentColor === 'fuchsia' ? "text-neutral-400" : "text-neutral-500");
            } else {
                accentClass = accentColor === "fuchsia" ? "accent-fuchsia-500 hover:accent-fuchsia-400" : (accentColor === 'slate' ? "accent-slate-500" : "accent-cyan-500 hover:accent-cyan-400");
                textClass = accentColor === "fuchsia" ? "text-fuchsia-400" : (accentColor === 'slate' ? "text-slate-400" : "text-cyan-400");
            }

            const focusClass = theme === 'minimalist' ? "focus-within:border-white" : (accentColor === "fuchsia" ? "focus-within:border-fuchsia-500" : "focus-within:border-cyan-500");
            const bgClass = theme === 'minimalist' ? "bg-neutral-900 border-neutral-700 focus-within:bg-neutral-800" : "bg-slate-800/50 border-slate-700 focus-within:bg-slate-800";

            return (
                <div className="flex flex-col space-y-1 mb-3 px-1">
                    <div className={`flex justify-between items-center text-xs font-mono ${textClass}`}>
                        <span className="font-bold opacity-90">{label}</span>
                        <div className={`flex items-center ${bgClass} rounded border ${focusClass} transition-colors`}>
                            <input type="number" value={localVal} onChange={handleInput} className={`w-12 bg-transparent text-right ${textClass} focus:text-white focus:outline-none px-1 py-0.5 text-[10px] font-mono`} />
                            <span className={`text-[10px] pr-1 select-none ${theme === 'minimalist' ? 'text-neutral-500' : 'text-slate-500'}`}>{unit}</span>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2">
                        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} className={`w-full h-1.5 ${theme === 'minimalist' ? 'bg-neutral-800' : 'bg-slate-700'} rounded-lg appearance-none cursor-pointer ${accentClass}`} />
                        {snap !== null && <button onClick={() => onChange(snap === 0 ? 0 : Math.round(value / snap) * snap)} className={`p-1 text-[9px] ${theme === 'minimalist' ? 'bg-neutral-900 text-neutral-400 border-neutral-700 hover:bg-neutral-800' : 'bg-slate-800 text-slate-400 border border-slate-700 hover:bg-slate-700'} border rounded min-w-[28px] flex-shrink-0 transition-colors`} title={`Snap to ${snap}${unit}`}>{snap}</button>}
                    </div>
                </div>
            );
        };

        const AccordionSection = ({ title, icon: SectionIcon, children, isOpen, onToggle, color = "slate", theme = "cyberpunk" }) => {
            let headerColor = "";
            let bgHover = "";

            if (theme === 'minimalist') {
                headerColor = "text-neutral-300 border-neutral-800";
                bgHover = "hover:bg-neutral-900";
                if (color === 'cyan') headerColor = "text-white border-neutral-800"; // Left
                if (color === 'fuchsia') headerColor = "text-neutral-500 border-neutral-800"; // Right
            } else {
                headerColor = color === "fuchsia" ? "text-fuchsia-400 border-fuchsia-900/30" : (color === "cyan" ? "text-cyan-400 border-cyan-900/30" : "text-slate-300 border-slate-700/50");
                bgHover = color === "fuchsia" ? "hover:bg-fuchsia-900/10" : (color === "cyan" ? "hover:bg-cyan-900/10" : "hover:bg-slate-800/50");
            }

            return (
                <div className={`border-b ${theme === 'minimalist' ? 'border-neutral-800' : 'border-slate-800'} last:border-0`}>
                    <button 
                        onClick={onToggle} 
                        className={`w-full flex items-center justify-between p-3 text-xs font-bold uppercase tracking-wider transition-colors ${headerColor} ${bgHover}`}
                    >
                        <div className="flex items-center space-x-2">
                            {SectionIcon && <SectionIcon size={14} />}
                            <span>{title}</span>
                        </div>
                        {isOpen ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
                    </button>
                    {isOpen && <div className="p-3 pt-0 animate-in slide-in-from-top-2 duration-200">
                        {children}
                    </div>}
                </div>
            );
        };

        const LimbRenderer = ({ start, end, color, thickness, glow, opacity = 1, theme = 'cyberpunk' }) => (
            <g opacity={opacity}>
                {glow && theme === 'cyberpunk' && <line x1={start.x} y1={start.y} x2={end.x} y2={end.y} stroke={color} strokeWidth={thickness + 8} strokeOpacity="0.2" strokeLinecap="round" />}
                <line x1={start.x} y1={start.y} x2={end.x} y2={end.y} stroke={color} strokeWidth={thickness} strokeLinecap="round" />
                <circle cx={end.x} cy={end.y} r={thickness / 1.5} fill={theme === 'minimalist' ? color : "#111"} stroke={color} strokeWidth="2" />
            </g>
        );

        const DraggableJoint = ({ x, y, isActive, onMouseDown, onTouchStart, isFK = true, theme = 'cyberpunk' }) => {
            const strokeColor = isActive ? (theme === 'minimalist' ? '#fff' : '#22d3ee') : (isFK ? (theme === 'minimalist' ? '#888' : 'white') : '#facc15');
            return (
                <g onMouseDown={onMouseDown} onTouchStart={onTouchStart} className="cursor-pointer" style={{ pointerEvents: 'all' }}>
                    <circle cx={x} cy={y} r={20} fill="transparent" />
                    <circle cx={x} cy={y} r={isActive ? 10 : 6} fill={isActive ? "#ffffff" : "rgba(255,255,255,0.3)"} stroke={strokeColor} strokeWidth={2} className="transition-all duration-75" />
                </g>
            );
        };

        const DancerFigure = ({ skeleton, lArmZ = 'front', rArmZ = 'front', opacity = 1, theme = 'cyberpunk', variant = 'main' }) => {
            const s = skeleton;
            const themeColors = THEMES[theme].colors;
            
            let colors = { ...themeColors };
            let isGhost = variant !== 'main';
            let currentOpacity = opacity;

            if (isGhost) {
                const ghostColor = variant === 'ghost-prev' ? themeColors.ghostPrev : themeColors.ghostNext;
                colors = {
                    left: ghostColor,
                    right: ghostColor,
                    core: ghostColor,
                    glow: false
                };
                currentOpacity = 0.3; // Fixed low opacity for ghosts
            }

            const renderLeftArm = () => (
                <>
                    <LimbRenderer start={s.lShoulderBase} end={s.lElbowPos} color={colors.left} thickness={8} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.lElbowPos} end={s.lWristPos} color={colors.left} thickness={6} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.lWristPos} end={s.lHandPos} color={colors.left} thickness={4} glow={false} theme={theme} />
                </>
            );

            const renderRightArm = () => (
                <>
                    <LimbRenderer start={s.rShoulderBase} end={s.rElbowPos} color={colors.right} thickness={8} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.rElbowPos} end={s.rWristPos} color={colors.right} thickness={6} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.rWristPos} end={s.rHandPos} color={colors.right} thickness={4} glow={false} theme={theme} />
                </>
            );

            // Simplified structure for Ghost to reduce clutter? No, keeping full structure for accuracy.
            return (
                <g opacity={currentOpacity} style={{ pointerEvents: isGhost ? 'none' : 'auto' }}>
                    {!isGhost && <line x1="-150" y1="190" x2="150" y2="190" stroke={theme === 'minimalist' ? '#333' : "#334155"} strokeWidth="2" strokeDasharray="5,5" opacity="0.5" />}

                    {lArmZ === 'back' && renderLeftArm()}
                    {rArmZ === 'back' && renderRightArm()}

                    <LimbRenderer start={s.rHipPos} end={s.rKneePos} color={colors.right} thickness={9} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.rKneePos} end={s.rAnklePos} color={colors.right} thickness={7} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.rAnklePos} end={s.rFootPos} color={colors.core} thickness={5} glow={false} theme={theme} />

                    <LimbRenderer start={s.lHipPos} end={s.lKneePos} color={colors.left} thickness={9} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.lKneePos} end={s.lAnklePos} color={colors.left} thickness={7} glow={colors.glow} theme={theme} />
                    <LimbRenderer start={s.lAnklePos} end={s.lFootPos} color={colors.left} thickness={5} glow={false} theme={theme} />

                    <path d={`M${s.rHipPos.x} ${s.rHipPos.y} L${s.rShoulderBase.x} ${s.rShoulderBase.y} L${s.lShoulderBase.x} ${s.lShoulderBase.y} L${s.lHipPos.x} ${s.lHipPos.y} Z`} fill={isGhost ? 'none' : (theme === 'minimalist' ? '#222' : "#334155")} stroke={colors.core} strokeWidth="2" />
                    <line x1={s.rHipPos.x} y1={s.rHipPos.y} x2={s.lHipPos.x} y2={s.lHipPos.y} stroke={colors.core} strokeWidth="3" />
                    <line x1={s.shoulderCenter.x} y1={s.shoulderCenter.y} x2={s.headCenterX} y2={s.headCenterY + s.headRadius / 2} stroke={colors.core} strokeWidth="10" strokeLinecap="round" />

                    <g transform={`rotate(${s.displayTilt}, ${s.headCenterX}, ${s.headCenterY})`}>
                        <circle cx={s.headCenterX} cy={s.headCenterY} r={s.headRadius} fill={isGhost ? 'none' : (theme === 'minimalist' ? '#111' : "#1e293b")} stroke={colors.core} strokeWidth="2" />
                        {!isGhost && <path d={`M${s.headCenterX - 10} ${s.headCenterY - 5} L${s.headCenterX - 5} ${s.headCenterY - 5}`} stroke={theme === 'minimalist' ? '#555' : "#475569"} strokeWidth="2" />}
                        {!isGhost && <path d={`M${s.headCenterX + 5} ${s.headCenterY - 5} L${s.headCenterX + 10} ${s.headCenterY - 5}`} stroke={theme === 'minimalist' ? '#555' : "#475569"} strokeWidth="2" />}
                    </g>

                    {lArmZ !== 'back' && renderLeftArm()}
                    {rArmZ !== 'back' && renderRightArm()}
                </g>
            );
        }

        function TuttingSimulator() {
            const [pose, setPose] = useState(PRESETS.idle);
            const [timeline, setTimeline] = useState([PRESETS.idle]);
            const [currentFrameIndex, setCurrentFrameIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [bpm, setBpm] = useState(100);
            const [showGrid, setShowGrid] = useState(true);
            const [zoom, setZoom] = useState(1);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const [selectedPreset, setSelectedPreset] = useState('');
            const [customPresets, setCustomPresets] = useState({});
            const [presetName, setPresetName] = useState("");
            const [isDragMode, setIsDragMode] = useState(false);
            const [dragType, setDragType] = useState('FK');
            const [activeJoint, setActiveJoint] = useState(null);
            const [formationType, setFormationType] = useState('single');
            const [lang, setLang] = useState('zh-TW');
            const [isHandSync, setIsHandSync] = useState(false);
            const [fixedJoints, setFixedJoints] = useState({ rWrist: false, lWrist: false, rAnkle: false, lAnkle: false });
            const [showTrails, setShowTrails] = useState(false);
            const [showOnionSkin, setShowOnionSkin] = useState(false); // NEW: Onion Skin State
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [theme, setTheme] = useState('cyberpunk');
            
            const [openSections, setOpenSections] = useState({
                body: true,
                rArm: true,
                lArm: true,
                rLeg: false,
                lLeg: false
            });

            const toggleSection = (section) => {
                setOpenSections(prev => ({ ...prev, [section]: !prev[section] }));
            };

            const fileInputRef = useRef(null);
            const svgRef = useRef(null);
            const mainGroupRef = useRef(null);
            const lastMousePos = useRef({ x: 0, y: 0 });
            const trailsRef = useRef({ left: [], right: [] });
            const showTrailsRef = useRef(showTrails);

            const timelineRef = useRef(timeline);
            const frameIndexRef = useRef(currentFrameIndex);
            const requestRef = useRef();
            const startTimeRef = useRef(0);

            const zoomRef = useRef(zoom);
            const activeJointRef = useRef(activeJoint);
            const isDragModeRef = useRef(isDragMode);
            const poseRef = useRef(pose);
            const dragTypeRef = useRef(dragType);

            useEffect(() => { timelineRef.current = timeline; }, [timeline]);
            useEffect(() => { frameIndexRef.current = currentFrameIndex; }, [currentFrameIndex]);
            useEffect(() => { zoomRef.current = zoom; }, [zoom]);
            useEffect(() => { activeJointRef.current = activeJoint; }, [activeJoint]);
            useEffect(() => { isDragModeRef.current = isDragMode; }, [isDragMode]);
            useEffect(() => { poseRef.current = pose; }, [pose]);
            useEffect(() => { dragTypeRef.current = dragType; }, [dragType]);
            useEffect(() => { showTrailsRef.current = showTrails; }, [showTrails]);

            const t = (key) => TRANSLATIONS[lang] ? (TRANSLATIONS[lang][key] || key) : key;
            const currentThemeConfig = THEMES[theme];

            const mirrorAngle = (deg) => (540 - deg) % 360;

            const handlePoseOperation = (type) => {
                if (isPlaying) return;
                setPose(prev => {
                    const newPose = { ...prev };
                    if (type === 'flip') {
                        newPose.lShoulder = mirrorAngle(prev.rShoulder);
                        newPose.rShoulder = mirrorAngle(prev.lShoulder);
                        newPose.lElbow = mirrorAngle(prev.rElbow);
                        newPose.rElbow = mirrorAngle(prev.lElbow);
                        newPose.lWrist = mirrorAngle(prev.rWrist);
                        newPose.rWrist = mirrorAngle(prev.lWrist);
                        newPose.lHip = mirrorAngle(prev.rHip);
                        newPose.rHip = mirrorAngle(prev.lHip);
                        newPose.lKnee = mirrorAngle(prev.rKnee);
                        newPose.rKnee = mirrorAngle(prev.lKnee);
                        newPose.lAnkle = mirrorAngle(prev.rAnkle);
                        newPose.rAnkle = mirrorAngle(prev.lAnkle);
                        newPose.bodyX = -prev.bodyX;
                        newPose.waist = -prev.waist;
                        newPose.headTilt = -prev.headTilt;
                        newPose.headSlide = -prev.headSlide;
                    } else if (type === 'mirrorLR') {
                        newPose.rShoulder = mirrorAngle(prev.lShoulder);
                        newPose.rElbow = mirrorAngle(prev.lElbow);
                        newPose.rWrist = mirrorAngle(prev.lWrist);
                        newPose.rHip = mirrorAngle(prev.lHip);
                        newPose.rKnee = mirrorAngle(prev.lKnee);
                        newPose.rAnkle = mirrorAngle(prev.lAnkle);
                    } else if (type === 'mirrorRL') {
                        newPose.lShoulder = mirrorAngle(prev.rShoulder);
                        newPose.lElbow = mirrorAngle(prev.rElbow);
                        newPose.lWrist = mirrorAngle(prev.rWrist);
                        newPose.lHip = mirrorAngle(prev.rHip);
                        newPose.lKnee = mirrorAngle(prev.rKnee);
                        newPose.lAnkle = mirrorAngle(prev.rAnkle);
                    }
                    return newPose;
                });
            };

            const updatePose = (key, value) => {
                if (!isPlaying) {
                    setPose(prev => {
                        const newPose = { ...prev, [key]: value };
                        if (key === 'waist' && isHandSync) {
                            const prevWaist = prev.waist || 0;
                            const delta = value - prevWaist;
                            const armKeys = ['lShoulder', 'lElbow', 'lWrist', 'rShoulder', 'rElbow', 'rWrist'];
                            armKeys.forEach(armKey => { newPose[armKey] = (prev[armKey] || 0) + delta; });
                        }
                        if ((key === 'bodyX' || key === 'bodyY') && Object.values(fixedJoints).some(v => v)) {
                            const prevSkeleton = calculateSkeleton(prev);
                            const newBaseSkeleton = calculateSkeleton(newPose); 
                            if (fixedJoints.rWrist) {
                                const [s, e] = solveTwoJointIK(prevSkeleton.rWristPos, newBaseSkeleton.rShoulderBase, SEGMENT_LENGTHS.upperArm, SEGMENT_LENGTHS.forearm, prev.rShoulder, prev.rElbow);
                                newPose.rShoulder = s; newPose.rElbow = e;
                            }
                            if (fixedJoints.lWrist) {
                                const [s, e] = solveTwoJointIK(prevSkeleton.lWristPos, newBaseSkeleton.lShoulderBase, SEGMENT_LENGTHS.upperArm, SEGMENT_LENGTHS.forearm, prev.lShoulder, prev.lElbow);
                                newPose.lShoulder = s; newPose.lElbow = e;
                            }
                            if (fixedJoints.rAnkle) {
                                const [h, k] = solveTwoJointIK(prevSkeleton.rAnklePos, newBaseSkeleton.rHipPos, SEGMENT_LENGTHS.thigh, SEGMENT_LENGTHS.shin, prev.rHip ?? 90, prev.rKnee ?? 90);
                                newPose.rHip = h; newPose.rKnee = k;
                            }
                            if (fixedJoints.lAnkle) {
                                const [h, k] = solveTwoJointIK(prevSkeleton.lAnklePos, newBaseSkeleton.lHipPos, SEGMENT_LENGTHS.thigh, SEGMENT_LENGTHS.shin, prev.lHip ?? 90, prev.lKnee ?? 90);
                                newPose.lHip = h; newPose.lKnee = k;
                            }
                        }
                        return newPose;
                    });
                }
            };

            const getSvgPoint = (clientX, clientY) => {
                if (!mainGroupRef.current) return { x: 0, y: 0 };
                const pt = svgRef.current.createSVGPoint();
                pt.x = clientX;
                pt.y = clientY;
                const svgP = pt.matrixTransform(mainGroupRef.current.getScreenCTM().inverse());
                return { x: svgP.x, y: svgP.y };
            };

            const handleJointDown = (e, jointName, pivot, type = 'angle', originPos = null) => {
                if (!isDragMode) return;
                e.preventDefault();
                e.stopPropagation();
                setIsPlaying(false);
                setActiveJoint({ name: jointName, pivot, type, origin: originPos });
            };

            const handleSvgMouseDown = (e) => {
                if (!activeJoint) {
                    setIsPanning(true);
                    lastMousePos.current = { x: e.clientX, y: e.clientY };
                }
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const newZoom = Math.min(5, Math.max(0.1, zoom - e.deltaY * 0.001));
                setZoom(newZoom);
            };

            const handleSvgMove = (clientX, clientY) => {
                if (isPanning) {
                    const dx = clientX - lastMousePos.current.x;
                    const dy = clientY - lastMousePos.current.y;
                    setPan(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                    lastMousePos.current = { x: clientX, y: clientY };
                    return;
                }
                const currentActiveJoint = activeJointRef.current;
                const currentIsDragMode = isDragModeRef.current;
                const currentDragType = dragTypeRef.current;
                const currentPose = poseRef.current;
                if (!currentActiveJoint || !currentIsDragMode) return;
                const mousePos = getSvgPoint(clientX, clientY);
                if (currentActiveJoint.type === 'headPos') {
                    const waistRad = toRad((currentPose.waist || 0) - 90);
                    const neckBaseX = currentActiveJoint.pivot.x;
                    const neckBaseY = currentActiveJoint.pivot.y;
                    const dx = mousePos.x - neckBaseX;
                    const dy = mousePos.y - neckBaseY;
                    const axisX = Math.cos(waistRad + Math.PI / 2);
                    const axisY = Math.sin(waistRad + Math.PI / 2);
                    const projection = dx * axisX + dy * axisY;
                    const newVal = Math.max(-50, Math.min(50, projection));
                    updatePose('headSlide', newVal);
                } else if (currentActiveJoint.type === 'headTilt') {
                    const dx = mousePos.x - currentActiveJoint.pivot.x;
                    const dy = mousePos.y - currentActiveJoint.pivot.y;
                    let angle = toDeg(Math.atan2(dy, dx));
                    const waistAngle = (currentPose.waist || 0) - 90;
                    let relativeTilt = shortAngleDist(waistAngle, angle);
                    updatePose('headTilt', Math.max(-60, Math.min(60, relativeTilt)));
                } else if (currentActiveJoint.type === 'pos') {
                    updatePose('bodyX', Math.max(-100, Math.min(100, mousePos.x)));
                    updatePose('bodyY', Math.max(-100, Math.min(100, mousePos.y)));
                } else if (currentDragType === 'IK' && currentActiveJoint.type === 'ik') {
                    const { name, origin } = currentActiveJoint;
                    if (name === 'rWrist') {
                        const [a1, a2] = solveTwoJointIK(mousePos, origin, SEGMENT_LENGTHS.upperArm, SEGMENT_LENGTHS.forearm, currentPose.rShoulder, currentPose.rElbow);
                        updatePose('rShoulder', a1); updatePose('rElbow', a2);
                    } else if (name === 'lWrist') {
                        const [a1, a2] = solveTwoJointIK(mousePos, origin, SEGMENT_LENGTHS.upperArm, SEGMENT_LENGTHS.forearm, currentPose.lShoulder, currentPose.lElbow);
                        updatePose('lShoulder', a1); updatePose('lElbow', a2);
                    } else if (name === 'rAnkle') {
                        const [a1, a2] = solveTwoJointIK(mousePos, origin, SEGMENT_LENGTHS.thigh, SEGMENT_LENGTHS.shin, currentPose.rHip ?? 90, currentPose.rKnee ?? 90);
                        updatePose('rHip', a1); updatePose('rKnee', a2);
                    } else if (name === 'lAnkle') {
                        const [a1, a2] = solveTwoJointIK(mousePos, origin, SEGMENT_LENGTHS.thigh, SEGMENT_LENGTHS.shin, currentPose.lHip ?? 90, currentPose.lKnee ?? 90);
                        updatePose('lHip', a1); updatePose('lKnee', a2);
                    }
                } else {
                    const dx = mousePos.x - currentActiveJoint.pivot.x;
                    const dy = mousePos.y - currentActiveJoint.pivot.y;
                    let angle = toDeg(Math.atan2(dy, dx));
                    if (angle < 0) angle += 360;
                    updatePose(currentActiveJoint.name, angle);
                }
            };

            const handleGlobalMouseUp = () => {
                setActiveJoint(null);
                setIsPanning(false);
            };

            useEffect(() => {
                const onMove = (e) => handleSvgMove(e.clientX, e.clientY);
                const onUp = () => handleGlobalMouseUp();
                const onTouchMove = (e) => handleSvgMove(e.touches[0].clientX, e.touches[0].clientY);
                if (activeJoint || isPanning) {
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                    window.addEventListener('touchmove', onTouchMove, { passive: false });
                    window.addEventListener('touchend', onUp);
                }
                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', onUp);
                };
            }, [activeJoint, isPanning]);

            const jumpToFrame = (index) => {
                if (isPlaying) setIsPlaying(false);
                setCurrentFrameIndex(index);
                setPose(timeline[index]);
            };

            const handleTimelineScrub = (e) => {
                const index = Number(e.target.value);
                if (isPlaying) setIsPlaying(false);
                setCurrentFrameIndex(index);
                setPose(timeline[index]);
            };

            const addKeyframe = () => {
                const newTimeline = [...timeline, { ...pose }];
                setTimeline(newTimeline);
                setCurrentFrameIndex(newTimeline.length - 1);
            };

            const updateKeyframe = () => {
                const newTimeline = [...timeline];
                newTimeline[currentFrameIndex] = { ...pose };
                setTimeline(newTimeline);
            };

            const deleteKeyframe = () => {
                if (timeline.length <= 1) return;
                const newTimeline = timeline.filter((_, i) => i !== currentFrameIndex);
                setTimeline(newTimeline);
                const newIndex = Math.min(currentFrameIndex, newTimeline.length - 1);
                setCurrentFrameIndex(newIndex);
                setPose(newTimeline[newIndex]);
            };

            const handleAIGenerate = () => {
                setIsPlaying(false);
                const presetKeys = Object.keys(PRESETS);
                const easingKeys = Object.keys(EASING_FUNCTIONS);
                const newLength = 16;
                const newTimeline = Array(newLength).fill(null).map((_, i) => {
                    const randomKey = presetKeys[Math.floor(Math.random() * presetKeys.length)];
                    const basePose = { ...PRESETS[randomKey] };
                    const randomTilt = Math.floor(Math.random() * 30) - 15;
                    basePose.headTilt = (basePose.headTilt || 0) + randomTilt;
                    const randomEasing = easingKeys[Math.floor(Math.random() * easingKeys.length)];
                    basePose.easing = randomEasing;
                    if (Math.random() > 0.6) basePose.headSlide = Math.floor(Math.random() * 40) - 20; else basePose.headSlide = 0;
                    if (Math.random() > 0.6) basePose.waist = Math.floor(Math.random() * 40) - 20;
                    if (Math.random() > 0.7) { if (Math.random() > 0.5) basePose.bodyX = Math.floor(Math.random() * 60) - 30; else basePose.bodyY = Math.floor(Math.random() * 40) - 20; } else { basePose.bodyX = 0; basePose.bodyY = 0; }
                    basePose.duration = 1;
                    basePose.lArmZ = 'front';
                    basePose.rArmZ = 'front';
                    return basePose;
                });
                setTimeline(newTimeline);
                setCurrentFrameIndex(0);
                setPose(newTimeline[0]);
                setTimeout(() => setIsPlaying(true), 500);
            };

            const handleExport = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(timeline));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "tutting_dance.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const handleImport = (event) => {
                const fileReader = new FileReader();
                const file = event.target.files[0];
                if (!file) return;
                fileReader.readAsText(file, "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const importedTimeline = JSON.parse(e.target.result);
                        if (Array.isArray(importedTimeline) && importedTimeline.length > 0) {
                            setIsPlaying(false);
                            setTimeline(importedTimeline);
                            setPose(importedTimeline[0]);
                            setCurrentFrameIndex(0);
                            alert(t('importSuccess'));
                        } else {
                            alert(t('importError'));
                        }
                    } catch (error) { alert(t('importFail')); }
                };
                event.target.value = null;
            };

            const handleSaveCustomPreset = () => {
                if (!presetName.trim()) { alert(t('nameEmpty')); return; }
                setCustomPresets(prev => ({ ...prev, [presetName]: { ...pose } }));
                setPresetName("");
                alert(t('saveSuccess'));
            };

            const handlePresetChange = (e) => {
                const key = e.target.value;
                setSelectedPreset(key);
                if (isPlaying) return;
                if (PRESETS[key]) setPose({ ...PRESETS[key] });
                else if (customPresets[key]) setPose(customPresets[key]);
            };

            useEffect(() => {
                if (!isPlaying) { 
                    if (requestRef.current) cancelAnimationFrame(requestRef.current); 
                    return; 
                }
                
                trailsRef.current = { left: [], right: [] };
                startTimeRef.current = performance.now();
                
                const animate = (time) => {
                    const currentIndex = frameIndexRef.current;
                    const startPose = timelineRef.current[currentIndex];
                    const stepDuration = (startPose.duration && startPose.duration > 0) 
                        ? startPose.duration * 1000 
                        : (60000 / bpm);

                    const elapsed = time - startTimeRef.current;
                    let progress = elapsed / stepDuration;
                    
                    if (progress >= 1) {
                        const nextIndex = (frameIndexRef.current + 1) % timelineRef.current.length;
                        setCurrentFrameIndex(nextIndex);
                        frameIndexRef.current = nextIndex;
                        startTimeRef.current = time;
                        progress = 0;
                    }
                    
                    const activeIndex = frameIndexRef.current;
                    const nextIndex = (activeIndex + 1) % timelineRef.current.length;
                    const currentStartPose = timelineRef.current[activeIndex];
                    const currentEndPose = timelineRef.current[nextIndex];
                    
                    const easingName = currentStartPose?.easing || 'Smooth (流暢)';
                    const easeFn = EASING_FUNCTIONS[easingName] || EASING_FUNCTIONS['Smooth (流暢)'];
                    
                    const easedProgress = easeFn(progress);
                    if (currentStartPose && currentEndPose) {
                        const newPose = interpolatePose(currentStartPose, currentEndPose, easedProgress);
                        if (showTrailsRef.current) {
                            const skel = calculateSkeleton(newPose);
                            trailsRef.current.left.push(skel.lWristPos);
                            trailsRef.current.right.push(skel.rWristPos);
                            if (trailsRef.current.left.length > 40) trailsRef.current.left.shift();
                            if (trailsRef.current.right.length > 40) trailsRef.current.right.shift();
                        }
                        setPose(newPose);
                    }
                    requestRef.current = requestAnimationFrame(animate);
                };
                requestRef.current = requestAnimationFrame(animate);
                return () => { if (requestRef.current) cancelAnimationFrame(requestRef.current); };
            }, [isPlaying, bpm]); 

            const handleZoomIn = () => setZoom(z => Math.min(5, z + 0.2));
            const handleZoomOut = () => setZoom(z => Math.max(0.1, z - 0.2));
            const handleResetView = () => {
                setZoom(1);
                setPan({ x: 0, y: 0 });
            };

            // --- Render Logic for Onion Skin ---
            const skeleton = useMemo(() => calculateSkeleton(pose), [pose]);
            
            // Calculate Ghosts if needed
            const prevPose = (!isPlaying && showOnionSkin && currentFrameIndex > 0) ? timeline[currentFrameIndex - 1] : null;
            const nextPose = (!isPlaying && showOnionSkin && currentFrameIndex < timeline.length - 1) ? timeline[currentFrameIndex + 1] : null;
            
            const prevSkeleton = useMemo(() => prevPose ? calculateSkeleton(prevPose) : null, [prevPose]);
            const nextSkeleton = useMemo(() => nextPose ? calculateSkeleton(nextPose) : null, [nextPose]);

            const formationData = FORMATIONS[formationType] || FORMATIONS['single'];
            const mainDancer = formationData.find(d => d.main) || formationData[0];

            return (
                <div className={`h-[100dvh] ${currentThemeConfig.bg} ${currentThemeConfig.text} font-sans selection:bg-cyan-500/30 flex flex-col md:flex-row overflow-hidden transition-colors duration-500`}>

                    {/* --- TOP/LEFT PANEL --- */}
                    <div className={`flex-1 h-[50%] md:h-full flex flex-col relative border-b md:border-b-0 md:border-r ${currentThemeConfig.borderColor} z-10 transition-colors duration-300 min-w-0`}>

                        <div className="absolute top-4 left-4 z-10 flex items-start gap-4 pointer-events-none">
                            <div>
                                <h1 className="text-xl md:text-3xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 filter drop-shadow-lg">{t('title')}</h1>
                                <p className={`text-[10px] md:text-xs font-mono mt-0.5 tracking-widest opacity-80 ${theme === 'minimalist' ? 'text-neutral-500' : 'text-slate-400'}`}>{t('subtitle')}</p>
                            </div>
                        </div>

                        <div className="absolute top-4 right-4 z-10 flex gap-2">
                            {!isSidebarOpen && (
                                <button 
                                    onClick={() => setIsSidebarOpen(true)} 
                                    className={`flex items-center justify-center p-2 ${currentThemeConfig.headerBg} backdrop-blur-md border ${currentThemeConfig.borderColor} rounded-full cursor-pointer hover:opacity-80 transition-all shadow-lg ${theme === 'minimalist' ? 'text-neutral-200' : 'text-cyan-400'} animate-in fade-in zoom-in duration-200`}
                                    title="Open Sidebar"
                                >
                                    <ArrowLeftFromLine size={16} />
                                </button>
                            )}
                            
                            {/* Theme Selector */}
                            <div className={`flex items-center ${currentThemeConfig.headerBg} backdrop-blur-md border ${currentThemeConfig.borderColor} rounded-full px-2 py-1.5 cursor-pointer hover:opacity-80 transition-all shadow-lg`}>
                                <Palette size={14} className={`${theme === 'minimalist' ? 'text-neutral-400' : 'text-slate-400'} mr-2 ml-1`} />
                                <select value={theme} onChange={(e) => setTheme(e.target.value)} className={`bg-transparent text-[10px] md:text-xs ${theme === 'minimalist' ? 'text-neutral-300' : 'text-slate-300'} focus:outline-none cursor-pointer appearance-none pr-2 font-medium`}>
                                    <option value="cyberpunk">{t('t_cyberpunk')}</option>
                                    <option value="minimalist">{t('t_minimalist')}</option>
                                </select>
                            </div>

                            <div className={`flex items-center ${currentThemeConfig.headerBg} backdrop-blur-md border ${currentThemeConfig.borderColor} rounded-full px-3 py-1.5 cursor-pointer hover:opacity-80 transition-all shadow-lg`}>
                                <Globe size={14} className={`${theme === 'minimalist' ? 'text-neutral-400' : 'text-slate-400'} mr-2`} />
                                <select value={lang} onChange={(e) => setLang(e.target.value)} className={`bg-transparent text-[10px] md:text-xs ${theme === 'minimalist' ? 'text-neutral-300' : 'text-slate-300'} focus:outline-none cursor-pointer appearance-none pr-2 font-medium`}>
                                    <option value="zh-TW">繁體中文</option>
                                    <option value="en">English</option>
                                    <option value="ja">日本語</option>
                                    <option value="ko">한국어</option>
                                    <option value="es">Español</option>
                                    <option value="pt">Português</option>
                                    <option value="fr">Français</option>
                                    <option value="de">Deutsch</option>
                                    <option value="vi">Tiếng Việt</option>
                                    <option value="hi">हिन्दी</option>
                                    <option value="ru">Русский</option>
                                </select>
                            </div>
                        </div>

                        <div className={`flex-1 w-full flex items-center justify-center overflow-hidden relative p-2 ${isPanning ? 'cursor-grabbing' : 'cursor-grab'}`}>
                            {showGrid && (
                                <div className="absolute inset-0 pointer-events-none"
                                    style={{
                                        opacity: currentThemeConfig.gridOpacity,
                                        backgroundImage: `linear-gradient(${theme === 'minimalist' ? '#666' : '#fff'} 1px, transparent 1px), linear-gradient(90deg, ${theme === 'minimalist' ? '#666' : '#fff'} 1px, transparent 1px)`,
                                        backgroundSize: '40px 40px',
                                    }}>
                                </div>
                            )}

                            <div className="relative h-full w-full flex items-center justify-center" onWheel={handleWheel} onMouseDown={handleSvgMouseDown}>
                                <svg ref={svgRef} className="w-full h-full select-none filter drop-shadow-[0_0_15px_rgba(0,0,0,0.5)]" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
                                    <defs>
                                        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                            <feGaussianBlur stdDeviation="4" result="coloredBlur" />
                                            <feMerge><feMergeNode in="coloredBlur" /><feMergeNode in="SourceGraphic" /></feMerge>
                                        </filter>
                                    </defs>

                                    <g ref={mainGroupRef} transform={`translate(${200 + pan.x}, ${200 + pan.y}) scale(${zoom})`}>
                                        {/* Trails Rendering */}
                                        {showTrails && (
                                            <g>
                                                <polyline points={trailsRef.current.left.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke={theme === 'minimalist' ? '#fff' : "#d946ef"} strokeWidth="2" strokeOpacity="0.4" strokeLinecap="round" strokeLinejoin="round" />
                                                <polyline points={trailsRef.current.right.map(p => `${p.x},${p.y}`).join(' ')} fill="none" stroke={theme === 'minimalist' ? '#888' : "#06b6d4"} strokeWidth="2" strokeOpacity="0.4" strokeLinecap="round" strokeLinejoin="round" />
                                            </g>
                                        )}

                                        {formationData.map((dancer, idx) => (
                                            <g key={idx} transform={`translate(${dancer.x}, ${dancer.y}) scale(${dancer.scale})`}>
                                                {/* Onion Skin: Previous Frame */}
                                                {prevSkeleton && mainDancer && idx === formationData.indexOf(mainDancer) && (
                                                    <DancerFigure 
                                                        skeleton={prevSkeleton} 
                                                        lArmZ={prevPose.lArmZ} 
                                                        rArmZ={prevPose.rArmZ} 
                                                        theme={theme} 
                                                        variant="ghost-prev" 
                                                    />
                                                )}
                                                
                                                {/* Onion Skin: Next Frame */}
                                                {nextSkeleton && mainDancer && idx === formationData.indexOf(mainDancer) && (
                                                    <DancerFigure 
                                                        skeleton={nextSkeleton} 
                                                        lArmZ={nextPose.lArmZ} 
                                                        rArmZ={nextPose.rArmZ} 
                                                        theme={theme} 
                                                        variant="ghost-next" 
                                                    />
                                                )}

                                                {/* Main Dancer */}
                                                <DancerFigure 
                                                    skeleton={skeleton} 
                                                    opacity={dancer.opacity} 
                                                    lArmZ={pose.lArmZ} 
                                                    rArmZ={pose.rArmZ}
                                                    theme={theme}
                                                />
                                            </g>
                                        ))}

                                        {isDragMode && mainDancer && (
                                            <g transform={`translate(${mainDancer.x}, ${mainDancer.y}) scale(${mainDancer.scale})`}>
                                                <DraggableJoint x={skeleton.hipCenterX} y={skeleton.hipCenterY} isActive={activeJoint?.name === 'bodyX'} onMouseDown={(e) => handleJointDown(e, 'bodyX', null, 'pos')} onTouchStart={(e) => handleJointDown(e, 'bodyX', null, 'pos')} theme={theme}/>
                                                <DraggableJoint x={skeleton.headCenterX} y={skeleton.headCenterY} isActive={activeJoint?.type === 'headPos'} onMouseDown={(e) => handleJointDown(e, 'head', skeleton.neckBase, 'headPos')} onTouchStart={(e) => handleJointDown(e, 'head', skeleton.neckBase, 'headPos')} theme={theme}/>
                                                <DraggableJoint x={skeleton.tiltHandleX} y={skeleton.tiltHandleY} isActive={activeJoint?.type === 'headTilt'} onMouseDown={(e) => handleJointDown(e, 'headTilt', { x: skeleton.headCenterX, y: skeleton.headCenterY }, 'headTilt')} onTouchStart={(e) => handleJointDown(e, 'headTilt', { x: skeleton.headCenterX, y: skeleton.headCenterY }, 'headTilt')} isFK={false} theme={theme}/>

                                                <DraggableJoint x={skeleton.rElbowPos.x} y={skeleton.rElbowPos.y} isActive={activeJoint?.name === 'rShoulder'} onMouseDown={(e) => handleJointDown(e, 'rShoulder', skeleton.rShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'rShoulder', skeleton.rShoulderBase)} theme={theme}/>
                                                <DraggableJoint x={skeleton.rWristPos.x} y={skeleton.rWristPos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'rWrist' : 'rElbow')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'rWrist' : 'rElbow', dragType === 'IK' ? skeleton.rShoulderBase : skeleton.rElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rShoulderBase)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'rWrist' : 'rElbow', dragType === 'IK' ? skeleton.rShoulderBase : skeleton.rElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rShoulderBase)} isFK={dragType === 'FK'} theme={theme}/>
                                                <DraggableJoint x={skeleton.rHandPos.x} y={skeleton.rHandPos.y} isActive={activeJoint?.name === 'rWrist'} onMouseDown={(e) => handleJointDown(e, 'rWrist', skeleton.rWristPos)} onTouchStart={(e) => handleJointDown(e, 'rWrist', skeleton.rWristPos)} theme={theme}/>

                                                <DraggableJoint x={skeleton.lElbowPos.x} y={skeleton.lElbowPos.y} isActive={activeJoint?.name === 'lShoulder'} onMouseDown={(e) => handleJointDown(e, 'lShoulder', skeleton.lShoulderBase)} onTouchStart={(e) => handleJointDown(e, 'lShoulder', skeleton.lShoulderBase)} theme={theme}/>
                                                <DraggableJoint x={skeleton.lWristPos.x} y={skeleton.lWristPos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'lWrist' : 'lElbow')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'lWrist' : 'lElbow', dragType === 'IK' ? skeleton.lShoulderBase : skeleton.lElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lShoulderBase)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'lWrist' : 'lElbow', dragType === 'IK' ? skeleton.lShoulderBase : skeleton.lElbowPos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lShoulderBase)} isFK={dragType === 'FK'} theme={theme}/>
                                                <DraggableJoint x={skeleton.lHandPos.x} y={skeleton.lHandPos.y} isActive={activeJoint?.name === 'lWrist'} onMouseDown={(e) => handleJointDown(e, 'lWrist', skeleton.lWristPos)} onTouchStart={(e) => handleJointDown(e, 'lWrist', skeleton.lWristPos)} theme={theme}/>

                                                <DraggableJoint x={skeleton.rKneePos.x} y={skeleton.rKneePos.y} isActive={activeJoint?.name === 'rHip'} onMouseDown={(e) => handleJointDown(e, 'rHip', skeleton.rHipPos)} onTouchStart={(e) => handleJointDown(e, 'rHip', skeleton.rHipPos)} theme={theme}/>
                                                <DraggableJoint x={skeleton.rAnklePos.x} y={skeleton.rAnklePos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'rAnkle' : 'rKnee')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'rAnkle' : 'rKnee', dragType === 'IK' ? skeleton.rHipPos : skeleton.rKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rHipPos)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'rAnkle' : 'rKnee', dragType === 'IK' ? skeleton.rHipPos : skeleton.rKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.rHipPos)} isFK={dragType === 'FK'} theme={theme}/>
                                                <DraggableJoint x={skeleton.rFootPos.x} y={skeleton.rFootPos.y} isActive={activeJoint?.name === 'rAnkle'} onMouseDown={(e) => handleJointDown(e, 'rAnkle', skeleton.rAnklePos)} onTouchStart={(e) => handleJointDown(e, 'rAnkle', skeleton.rAnklePos)} theme={theme}/>

                                                <DraggableJoint x={skeleton.lKneePos.x} y={skeleton.lKneePos.y} isActive={activeJoint?.name === 'lHip'} onMouseDown={(e) => handleJointDown(e, 'lHip', skeleton.lHipPos)} onTouchStart={(e) => handleJointDown(e, 'lHip', skeleton.lHipPos)} theme={theme}/>
                                                <DraggableJoint x={skeleton.lAnklePos.x} y={skeleton.lAnklePos.y} isActive={activeJoint?.name === (dragType === 'IK' ? 'lAnkle' : 'lKnee')} onMouseDown={(e) => handleJointDown(e, dragType === 'IK' ? 'lAnkle' : 'lKnee', dragType === 'IK' ? skeleton.lHipPos : skeleton.lKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lHipPos)} onTouchStart={(e) => handleJointDown(e, dragType === 'IK' ? 'lAnkle' : 'lKnee', dragType === 'IK' ? skeleton.lHipPos : skeleton.lKneePos, dragType === 'IK' ? 'ik' : 'angle', skeleton.lHipPos)} isFK={dragType === 'FK'} theme={theme}/>
                                                <DraggableJoint x={skeleton.lFootPos.x} y={skeleton.lFootPos.y} isActive={activeJoint?.name === 'lAnkle'} onMouseDown={(e) => handleJointDown(e, 'lAnkle', skeleton.lAnklePos)} onTouchStart={(e) => handleJointDown(e, 'lAnkle', skeleton.lAnklePos)} theme={theme}/>
                                            </g>
                                        )}
                                    </g>
                                </svg>

                                {/* Overlay Controls */}
                                <div className="absolute bottom-4 right-4 flex space-x-2 pointer-events-auto">
                                    <div className={`glass-panel rounded-xl border ${currentThemeConfig.borderColor} flex items-center p-1 shadow-lg`}>
                                        <button onClick={() => setIsDragMode(!isDragMode)} className={`p-2 rounded-lg transition-all ${isDragMode ? 'bg-fuchsia-500 text-white shadow-lg shadow-fuchsia-500/30' : `${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10`}`} title={isDragMode ? t('dragModeOn') : t('dragModeOff')}>
                                            <Hand size={18} />
                                        </button>
                                        {isDragMode && (
                                            <>
                                                <div className={`w-px h-6 ${theme === 'minimalist' ? 'bg-neutral-700' : 'bg-slate-700/50'} mx-1`}></div>
                                                <button onClick={() => setDragType(prev => prev === 'FK' ? 'IK' : 'FK')} className={`px-2 py-1 text-[10px] font-mono font-bold ${theme === 'minimalist' ? 'text-neutral-400' : 'text-slate-300'} hover:bg-white/10 rounded transition-colors min-w-[36px]`} title={t(dragType.toLowerCase())}>
                                                    {dragType}
                                                </button>
                                            </>
                                        )}
                                    </div>
                                    
                                    <div className={`glass-panel rounded-xl border ${currentThemeConfig.borderColor} flex items-center p-1 shadow-lg`}>
                                        <button onClick={handleZoomOut} className={`p-2 rounded-lg ${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10 transition-colors`}><ZoomOut size={18} /></button>
                                        <button onClick={handleResetView} className={`px-2 py-1 text-[10px] font-mono ${theme === 'minimalist' ? 'text-neutral-400' : 'text-slate-300'} min-w-[50px] hover:bg-white/10 rounded transition-colors`} title={t('resetView')}>
                                            {Math.round(zoom * 100)}%
                                        </button>
                                        <button onClick={handleZoomIn} className={`p-2 rounded-lg ${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10 transition-colors`}><ZoomIn size={18} /></button>
                                    </div>

                                    <div className={`glass-panel rounded-xl border ${currentThemeConfig.borderColor} flex items-center p-1 shadow-lg`}>
                                        <button onClick={() => setShowOnionSkin(!showOnionSkin)} className={`p-2 rounded-lg transition-colors ${showOnionSkin ? 'text-yellow-400 bg-yellow-500/10' : `${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10`}`} title={t('onionSkin')}><OnionSkinIcon size={18} /></button>
                                        <div className={`w-px h-6 ${theme === 'minimalist' ? 'bg-neutral-700' : 'bg-slate-700/50'} mx-1`}></div>
                                        <button onClick={() => setShowTrails(!showTrails)} className={`p-2 rounded-lg transition-colors ${showTrails ? 'text-fuchsia-400 bg-fuchsia-500/10' : `${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10`}`} title={t('motionTrails')}><Activity size={18} /></button>
                                        <button onClick={() => setShowGrid(!showGrid)} className={`p-2 rounded-lg transition-colors ${showGrid ? (theme === 'minimalist' ? 'text-white bg-white/10' : 'text-cyan-400 bg-cyan-500/10') : `${currentThemeConfig.ui.buttonInactive} hover:${currentThemeConfig.ui.buttonActive} hover:bg-white/10`}`}><Grid size={18} /></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Timeline */}
                        <div className={`w-full ${currentThemeConfig.panelBg} backdrop-blur p-3 border-t ${currentThemeConfig.borderColor} flex-shrink-0 z-20 shadow-[0_-1px_10px_rgba(0,0,0,0.3)]`}>
                            <div className="flex flex-wrap justify-between items-center mb-2 gap-2">
                                <span className={`text-[10px] md:text-xs font-bold ${theme === 'minimalist' ? 'text-neutral-500' : 'text-slate-500'} uppercase tracking-widest flex items-center`}><Layers size={12} className="mr-1"/>{t('timeline')} ({timeline.length})</span>
                                <div className="flex items-center space-x-2 md:space-x-4">
                                    <button onClick={handleAIGenerate} className="flex items-center space-x-1 px-3 py-1 bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 text-white rounded-full text-[10px] font-bold transition-all shadow-lg shadow-fuchsia-900/50"><Sparkles size={12} /><span>{t('ai')}</span></button>
                                    <div className={`w-px h-4 ${theme === 'minimalist' ? 'bg-neutral-800' : 'bg-slate-700/50'} hidden md:block`}></div>
                                    <div className="hidden md:flex items-center space-x-2">
                                        <Settings size={12} className={theme === 'minimalist' ? 'text-neutral-500' : 'text-slate-500'} />
                                        <select value={pose.easing || 'Smooth (流暢)'} onChange={(e) => updatePose('easing', e.target.value)} className={`${theme === 'minimalist' ? 'bg-neutral-800 border-neutral-700 text-neutral-300 hover:border-neutral-600' : 'bg-slate-800 border-slate-700 text-slate-300 hover:border-slate-600'} border text-[10px] rounded px-2 py-1 focus:outline-none cursor-pointer`}>
                                            {Object.keys(EASING_FUNCTIONS).map(name => (<option key={name} value={name}>{name.split(' ')[0]}</option>))}
                                        </select>
                                    </div>
                                    <div className={`flex items-center space-x-2 ${theme === 'minimalist' ? 'bg-neutral-800/50 border-neutral-700/50' : 'bg-slate-800/50 border-slate-700/50'} rounded px-2 py-1 border`}>
                                        <label className={`text-[10px] ${theme === 'minimalist' ? 'text-neutral-500' : 'text-slate-500'} font-mono`}>{t('bpm')}</label>
                                        <input type="number" value={bpm} onChange={(e) => setBpm(Number(e.target.value))} className={`w-8 bg-transparent text-[10px] text-center ${theme === 'minimalist' ? 'text-white' : 'text-cyan-400'} font-mono focus:outline-none`} />
                                    </div>
                                </div>
                            </div>
                            <div className="w-full mb-3 px-1">
                                <input type="range" min={0} max={Math.max(0, timeline.length - 1)} value={currentFrameIndex} onChange={handleTimelineScrub} className={`w-full h-1.5 ${theme === 'minimalist' ? 'bg-neutral-800 accent-white' : 'bg-slate-800 accent-cyan-500'} rounded-lg appearance-none cursor-pointer hover:opacity-90 block`} />
                            </div>
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-3 overflow-x-auto pb-2 custom-scrollbar no-scrollbar-mobile pr-4 mask-image-right">
                                    <button onClick={() => setIsPlaying(!isPlaying)} className={`p-3 rounded-full flex-shrink-0 transition-all transform hover:scale-105 active:scale-95 ${isPlaying ? 'bg-red-500/90 hover:bg-red-500 text-white shadow-lg shadow-red-500/30' : 'bg-emerald-500/90 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/30'}`}>{isPlaying ? <Square fill="currentColor" size={12} /> : <Play fill="currentColor" size={14} className="ml-0.5" />}</button>
                                    <div className="flex space-x-1">
                                        {timeline.map((_, idx) => (
                                            <button key={idx} onClick={() => jumpToFrame(idx)} className={`w-8 h-12 md:w-10 md:h-14 flex-shrink-0 rounded-md border transition-all flex flex-col items-center justify-center relative group ${currentFrameIndex === idx ? (theme === 'minimalist' ? 'border-white bg-white/20 scale-105 z-10' : 'border-cyan-500/50 bg-cyan-500/10 scale-105 z-10') : (theme === 'minimalist' ? 'border-neutral-800 bg-neutral-900 hover:bg-neutral-800 hover:border-neutral-700' : 'border-slate-700/50 bg-slate-800/30 hover:bg-slate-800 hover:border-slate-600')}`}>
                                                <span className={`text-[10px] font-mono ${currentFrameIndex === idx ? (theme === 'minimalist' ? 'text-white font-bold' : 'text-cyan-400 font-bold') : (theme === 'minimalist' ? 'text-neutral-600 group-hover:text-neutral-400' : 'text-slate-600 group-hover:text-slate-400')}`}>{idx + 1}</span>
                                                {currentFrameIndex === idx && <div className={`absolute bottom-1 w-1 h-1 rounded-full ${theme === 'minimalist' ? 'bg-white' : 'bg-cyan-500 shadow-[0_0_5px_cyan]'}`}></div>}
                                            </button>
                                        ))}
                                        <button onClick={addKeyframe} className={`w-8 h-12 md:w-10 md:h-14 flex-shrink-0 rounded-md border border-dashed ${theme === 'minimalist' ? 'border-neutral-800 hover:border-white text-neutral-600 hover:text-white hover:bg-neutral-800' : 'border-slate-700 hover:border-cyan-500/50 text-slate-600 hover:text-cyan-500 hover:bg-slate-800'} flex items-center justify-center transition-all`}><Plus size={16} /></button>
                                    </div>
                                </div>
                                <div className={`flex space-x-2 pl-4 border-l ${theme === 'minimalist' ? 'border-neutral-800' : 'border-slate-800'}`}>
                                    <button onClick={updateKeyframe} className={`p-2 rounded ${theme === 'minimalist' ? 'hover:bg-white/10 text-white' : 'hover:bg-cyan-500/10 text-cyan-500'} transition-colors`} title={t('modify')}><Edit size={16} /></button>
                                    <button onClick={deleteKeyframe} className="p-2 rounded hover:bg-red-500/10 text-red-500 transition-colors" title={t('delete')}><Trash2 size={16} /></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- BOTTOM/RIGHT PANEL --- */}
                    <div className={`
                        transition-all duration-500 ease-in-out flex flex-col shadow-2xl z-30 ${currentThemeConfig.panelBg} md:${theme === 'minimalist' ? 'bg-black' : 'bg-[#0b1120]'} border-t md:border-t-0 md:border-l ${currentThemeConfig.borderColor}
                        ${isSidebarOpen ? 'w-full md:w-[360px] h-[50%] md:h-full opacity-100' : 'w-full md:w-0 h-0 md:h-full opacity-0 overflow-hidden border-0'}
                    `}>
                        
                        {/* Fixed Header: Tools & Global Settings */}
                        <div className={`p-4 border-b ${currentThemeConfig.borderColor} ${currentThemeConfig.headerBg} backdrop-blur-sm z-10`}>
                            <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center">
                                    <button onClick={() => setIsSidebarOpen(false)} className="mr-2 text-slate-500 hover:text-white transition-colors" title="Collapse Sidebar"><ArrowRightToLine size={16}/></button>
                                    <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center"><RotateCcw className="mr-2" size={12} /> {t('manage')}</h2>
                                </div>
                                <div className="flex space-x-1">
                                    <button onClick={handleExport} className={`p-1.5 text-slate-400 ${theme === 'minimalist' ? 'hover:text-white hover:bg-neutral-800' : 'hover:text-cyan-400 hover:bg-slate-800'} rounded transition-colors`} title={t('export')}><Download size={14}/></button>
                                    <button onClick={() => fileInputRef.current.click()} className={`p-1.5 text-slate-400 ${theme === 'minimalist' ? 'hover:text-white hover:bg-neutral-800' : 'hover:text-fuchsia-400 hover:bg-slate-800'} rounded transition-colors`} title={t('import')}><Upload size={14}/></button>
                                    <input type="file" ref={fileInputRef} onChange={handleImport} accept=".json" className="hidden" />
                                </div>
                            </div>

                            {/* Tools Grid */}
                            <div className="grid grid-cols-3 gap-2 mb-4">
                                <button onClick={() => handlePoseOperation('flip')} className={`flex items-center justify-center space-x-2 py-2 ${theme === 'minimalist' ? 'bg-neutral-900 hover:bg-neutral-800 border-neutral-800' : 'bg-slate-800 hover:bg-slate-700 border-slate-700'} border rounded-md transition-all group`}>
                                    <FlipIcon size={14} className="text-slate-400 group-hover:text-white" />
                                    <span className="text-[10px] font-medium text-slate-400 group-hover:text-white">{t('flip')}</span>
                                </button>
                                <button onClick={() => handlePoseOperation('mirrorLR')} className={`flex items-center justify-center space-x-2 py-2 ${theme === 'minimalist' ? 'bg-neutral-900 hover:bg-neutral-800 border-neutral-800' : 'bg-slate-800 hover:bg-slate-700 border-slate-700'} border rounded-md transition-all group`}>
                                    <div className="flex text-[10px] font-bold"><span className={theme === 'minimalist' ? 'text-white' : 'text-fuchsia-500'}>L</span><span className="text-slate-500 mx-0.5">→</span><span className={theme === 'minimalist' ? 'text-neutral-500' : 'text-cyan-500'}>R</span></div>
                                </button>
                                <button onClick={() => handlePoseOperation('mirrorRL')} className={`flex items-center justify-center space-x-2 py-2 ${theme === 'minimalist' ? 'bg-neutral-900 hover:bg-neutral-800 border-neutral-800' : 'bg-slate-800 hover:bg-slate-700 border-slate-700'} border rounded-md transition-all group`}>
                                    <div className="flex text-[10px] font-bold"><span className={theme === 'minimalist' ? 'text-neutral-500' : 'text-cyan-500'}>R</span><span className="text-slate-500 mx-0.5">→</span><span className={theme === 'minimalist' ? 'text-white' : 'text-fuchsia-500'}>L</span></div>
                                </button>
                            </div>

                            {/* Preset & Duration */}
                            <div className={`${theme === 'minimalist' ? 'bg-neutral-900/40 border-neutral-800' : 'bg-slate-800/40 border-slate-700/50'} rounded-lg p-2 border space-y-2`}>
                                <div className="flex gap-2">
                                    <select value={selectedPreset} onChange={handlePresetChange} className={`flex-1 ${theme === 'minimalist' ? 'bg-neutral-950 border-neutral-800 text-neutral-300 focus:border-white' : 'bg-slate-900 border-slate-700 text-slate-300 focus:border-cyan-500/50'} border text-[10px] rounded px-2 py-1.5 focus:outline-none`}>
                                        <option value="" disabled>{t('selectPreset')}</option>
                                        <optgroup label={t('presets')}>{Object.keys(PRESETS).map(key => (<option key={key} value={key}>{t(`p_${key}`)}</option>))}</optgroup>
                                        {Object.keys(customPresets).length > 0 && <optgroup label={t('custom')}>{Object.keys(customPresets).map(key => (<option key={key} value={key}>{key}</option>))}</optgroup>}
                                    </select>
